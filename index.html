Other recommended resource: Mike Piff, Discrete Mathematics, An Introduction for Software Engineers, Cambridge University Press, 1992.
Other recommended resource: Todd Feil and Joan Krone, Essential Discrete Mathematics, Prentice Hall, 2003.</script>
<script type="application/json" id="quiz-math100-module3">[{"q":"A statement formed from simpler statements by using connectives such as AND, OR, and NOT is called a:","options":["Predicate with a free variable","Truth table","Compound proposition","Tautology"],"answer":2,"explanation":"A compound proposition is built from simpler propositions using Boolean connectives. A truth table is only a tool for listing the truth values of such a proposition, and a tautology is a special compound proposition that is true in every row. A predicate with a free variable is not covered by propositional logic.","source":"notes"},{"q":"Which description of the disjunction p OR q (inclusive or) is correct?","options":["True when at least one of p, q is true; false only when both are false","True only when exactly one of p and q is true","True only when both p and q are true","False only when p is true and q is false"],"answer":0,"explanation":"Inclusive OR is true in rows T,T, T,F and F,T and false only in F,F. Option B describes XOR, option C describes AND, and option D describes the implication p -> q.","source":"notes"},{"q":"Which statement correctly describes p XOR q (exclusive or)?","options":["It is true when p and q are both true","It is true when at least one of p and q is true","It is true when p and q have the same truth value","It is true when exactly one of p and q is true, but not both"],"answer":3,"explanation":"XOR has truth values F, T, T, F in rows TT, TF, FT, FF. Option A and option B describe features of AND and OR, and option C describes the biconditional p <-> q, which is the opposite of XOR.","source":"notes"},{"q":"In the implication p -> q, the proposition q is called the:","options":["Antecedent","Consequent","Converse","Contrapositive"],"answer":1,"explanation":"In p -> q, p is the antecedent and q is the consequent. The converse and contrapositive are names for other implications formed from p -> q, not for its parts.","source":"notes"},{"q":"Compound propositions p and q are logically equivalent exactly when:","options":["p and q are both true in at least one row of their truth tables","p AND q is a tautology","p <-> q is a tautology","p -> q is true in exactly one row"],"answer":2,"explanation":"Logical equivalence means p <-> q is a tautology, which is the same as p and q having identical truth values in all rows. If p AND q were a tautology, both would always be true, which is stronger than equivalence and not required, since two propositions can always be false together.","source":"notes"},{"q":"Which statement is logically equivalent to NOT (A OR B)?","options":["NOT A OR NOT B","NOT A AND NOT B","NOT A AND B","A AND B"],"answer":1,"explanation":"By De Morgan's law, the negation of A OR B is NOT A AND NOT B. Option A is the negation of A AND B, which is a common mix-up. Check with A false and B true: NOT (F OR T) = F, and NOT A AND NOT B = T AND F = F, but NOT A OR NOT B = T OR F = T, which differs.","source":"notes"},{"q":"A compound proposition p1 AND p2 AND p3 AND p4 AND p5 is built from 5 different simple propositions. How many rows does its truth table have?","options":["25","10","5","32"],"answer":3,"explanation":"A truth table for n simple propositions has 2^n rows. Here 2^5 = 32. The values 25 (5^2) and 10 (2*5) come from using the wrong formula.","source":"notes"},{"q":"Which of the following sets of connectives is NOT sufficient to express every possible truth table?","options":["NOT and XOR","NOT and AND","NOT and OR","NOT, AND, and OR together"],"answer":0,"explanation":"NOT with AND is sufficient, and NOT with OR is sufficient. Any set that contains one of these two pairs is also sufficient, so NOT, AND, and OR together works. NOT with XOR is not universal.","source":"notes"},{"q":"A student wants to prove two compound propositions are logically equivalent using truth tables. Which order of steps is correct?","options":["Compute the final columns first, then list the T/F combinations, then compute the sub-expressions, then compare","List all T/F combinations, compute the sub-expressions and then both final columns, then compare the two final columns in every row","List all T/F combinations, compare the two final columns in the first row only, then compute the sub-expressions","Compute the sub-expressions, list all T/F combinations, compare the final columns in the last row only, then compute the final columns"],"answer":1,"explanation":"The rows must be listed first, then the sub-expression columns, then the final columns of both propositions, and finally all rows must be compared. Comparing only one row proves nothing, because equivalence requires a match in every row.","source":"notes"},{"q":"Which order of steps correctly builds the truth table of (P OR Q) -> R?","options":["Compute (P OR Q) -> R; list the eight rows of P, Q, R; compute the column P OR Q","List the four rows of P and Q; compute (P OR Q) -> R; compute P OR Q","List the eight combinations of P, Q, R; compute the column P OR Q; compute the column (P OR Q) -> R","Compute P OR Q; list the eight rows of P, Q, R; compute (P OR Q) -> R"],"answer":2,"explanation":"Three simple propositions give 2^3 = 8 rows, which must be listed first. Then the inner expression P OR Q is computed, and only then the whole implication, which uses the P OR Q column and the R column. Listing only four rows ignores R.","source":"notes"},{"q":"Which of the following is NOT a proposition?","options":["1 + 2","1 + 2 = 3","Beijing is the capital of China","It is raining (in a given situation)"],"answer":0,"explanation":"The expression 1 + 2 has the numerical value 3, not a truth value of true or false, so it is not a proposition. The statement 1 + 2 = 3 is true, the statement about Beijing is true, and It is raining is true or false in any given situation.","source":"notes"},{"q":"Which statement about the implication p -> q is NOT true?","options":["It is false only when p is true and q is false","It is logically equivalent to its contrapositive, NOT q -> NOT p","It does not claim that p causes q","It is logically equivalent to its converse, q -> p"],"answer":3,"explanation":"The converse is not equivalent to the original implication: in the row p = T, q = F, p -> q is false but q -> p is true. The other three statements are true facts about implication.","source":"notes"},{"q":"For which assignment of truth values is (P OR Q) -> R false?","options":["P = F, Q = F, R = F","P = T, Q = T, R = T","P = F, Q = T, R = T","P = T, Q = F, R = F"],"answer":3,"explanation":"An implication is false only when its antecedent is true and its consequent is false. For P = T, Q = F, R = F: P OR Q = T and R = F, so T -> F = F. For P = F, Q = F, R = F: P OR Q = F, so F -> F = T. The other two options have R = T, which makes the implication true.","source":"notes"},{"q":"Let s = I studied, e = the exam is easy, and l = I got lucky. Which expression represents: I studied, and either the exam is easy or I got lucky?","options":["(s AND e) OR l","s OR (e AND l)","s AND (e OR l)","s AND e AND l"],"answer":2,"explanation":"The main connective is AND, joining s with the grouped phrase either e or l, which is (e OR l). Option A has the wrong grouping and means I studied and the exam is easy, or I got lucky. Option D requires both e and l to be true.","source":"notes"},{"q":"Which statement is the contrapositive of: If you study hard, then you will get a good grade?","options":["If you get a good grade, then you studied hard.","If you do not get a good grade, then you did not study hard.","If you do not study hard, then you will not get a good grade.","If you study hard, then you will not get a good grade."],"answer":1,"explanation":"The contrapositive of p -> q is NOT q -> NOT p, which swaps and negates both parts. Option A is the converse and option C is the inverse. Option D negates only the consequent.","source":"notes"},{"q":"Let p be false and q be true. Which of the following compound propositions has the truth value true?","options":["p XOR q","p <-> q","q -> p","p AND q"],"answer":0,"explanation":"With p = F and q = T: p XOR q = T because exactly one is true. p <-> q = F because the values differ. q -> p = (T -> F) = F. p AND q = F.","source":"notes"},{"q":"Which statement correctly characterizes the biconditional p <-> q?","options":["It is true only when both p and q are true.","It is true when exactly one of p and q is true.","It is true when p and q have the same truth value.","It is true when p and q have different truth values."],"answer":2,"explanation":"A biconditional is true when its two propositions have the same truth value: both true or both false. Exactly one true describes XOR; requiring both true is too restrictive, and different truth values is the opposite condition.","source":"notes"},{"q":"Let p be false and q be false. What is the truth value of p -> q?","options":["False, because both propositions are false.","True, because an implication is false only when its antecedent is true and its consequent is false.","Undetermined unless p causes q.","False, because the consequent is false."],"answer":1,"explanation":"Here the antecedent p is false, so this is not the one falsifying case. The only false case is p = T and q = F; therefore F -> F is true. The implication is truth-functional and does not depend on causation.","source":"notes"},{"q":"Which statement about propositions is NOT true?","options":["An imperative command does not have a definite truth value and is not a proposition.","A declarative sentence with a definite truth value can be a proposition even when it is false.","A question does not by itself assert a statement with a definite truth value.","A declarative sentence that is false cannot be a proposition, because propositions must be true."],"answer":3,"explanation":"A proposition must have a definite truth value, which may be either true or false. It need not be true. Commands and questions do not assert declarative propositions with definite truth values, while the false declarative sentence described in the last option can still be a proposition.","source":"notes"},{"q":"A student interprets p -> q as saying that p causes q and that p must actually occur. Which correction matches the truth-functional meaning of implication?","options":["If p is false, p -> q is true regardless of q, and the implication does not assert causation.","The implication asserts that p causes q, so it is false whenever p is false.","The implication is equivalent to q -> p, so q must occur before p.","The implication is true only when both p and q are true."],"answer":0,"explanation":"An implication is false only when p is true and q is false. Thus, with a false antecedent p, it is true for either truth value of q, and the connective does not state that p causes q. The other choices impose causation, reverse the implication, or require both parts true.","source":"notes"},{"q":"A compound proposition that is true in every row of its truth table is called a","options":["tautology","contradiction","converse","biconditional"],"answer":0,"explanation":"A tautology is true in every row of its truth table, for example p OR NOT p. A contradiction is the opposite, false in every row, such as p AND NOT p. The converse is the implication q -> p, and a biconditional is the connective p <-> q, which is true in only some rows.","source":"notes"},{"q":"A declarative sentence with a definite meaning whose truth value is exactly true or false, never both and never neither, is called a","options":["Boolean connective","proposition","truth table","expression"],"answer":1,"explanation":"This is the definition of a proposition, for example 1 + 2 = 3 or 1 + 2 = 5 (which is false but still definite). A Boolean connective such as AND or OR joins propositions, a truth table lists truth values, and an expression such as 1 + 2 names a number and has no truth value.","source":"notes"},{"q":"Which pair correctly gives the converse and the inverse of the implication p -> q?","options":["Converse: NOT q -> NOT p; inverse: q -> p","Converse: NOT p -> NOT q; inverse: q -> p","Converse: q -> p; inverse: NOT p -> NOT q","Converse: q -> p; inverse: NOT q -> NOT p"],"answer":2,"explanation":"The converse swaps the two parts, giving q -> p. The inverse negates both parts and keeps the order, giving NOT p -> NOT q. The expression NOT q -> NOT p swaps and negates, so it is the contrapositive, which is why options that use it for the converse or the inverse are wrong. The option that exchanges the converse and the inverse is also wrong.","source":"notes"},{"q":"In the standard truth table with rows TT, TF, FT, FF, in which row do p OR q and p XOR q have different truth values?","options":["p = F, q = F","p = T, q = F","p = F, q = T","p = T, q = T"],"answer":3,"explanation":"For p = T, q = T: p OR q = T but p XOR q = F, so they differ. For p = T, q = F and p = F, q = T both are T, and for p = F, q = F both are F. XOR excludes the case where both inputs are true, and that is the only difference from OR.","source":"notes"},{"q":"In C, C++, and Java, which connectives do the word-wise operators != and == correspond to, respectively?","options":["XOR and iff (the biconditional)","iff (the biconditional) and XOR","NOT and AND","AND and OR"],"answer":0,"explanation":"The operator != is true when its two sides differ, which is XOR, and == is true when its two sides are the same, which is the biconditional. The reversed pairing swaps them. NOT and AND are written ! and &&, and AND and OR are written && and ||.","source":"notes"},{"q":"Which order of steps correctly translates the sentence 'I just saw my old friend, and either he has grown or I have shrunk' into symbols?","options":["Write the connectives first; name the simple propositions; find the main connective; check the grouping","Name the simple propositions; find the main connective; write the either-or phrase as one grouped piece; assemble and check the grouping","Name the simple propositions; write the connectives left to right with no parentheses; find the main connective; group the pieces","Find the main connective; write the grouped piece; name the simple propositions; check the grouping"],"answer":1,"explanation":"Name f, g, s first; the main connective is AND, joining f with the whole phrase; the phrase 'he has grown or I have shrunk' is g OR s and must be grouped; the result is f AND (g OR s), and the check confirms that (f AND g) OR s would mean something different. You cannot find a main connective or build a grouped piece before the simple propositions are named.","source":"notes"},{"q":"Which order of steps correctly negates the statement 'I am both rich and happy'?","options":["Negate each part and keep AND; name A and B; read the result in words","Swap AND with OR; name A and B; negate only the first part; read the result in words","Name A and B; identify the connective AND; negate each part and swap AND with OR; read the result in words","Read the result in words; name A and B; identify the connective; negate each part and swap AND with OR"],"answer":2,"explanation":"Let A = I am rich and B = I am happy. Identify the connective AND, then push NOT inside and swap AND with OR to get NOT A OR NOT B, which reads 'I am not rich or I am not happy'. Keeping AND gives NOT A AND NOT B, which is the negation of A OR B. The other orders read the result before it exists or negate only one part.","source":"notes"},{"q":"A student negates 'The lawn is wet and the sprinklers came on' as 'The lawn is not wet and the sprinklers did not come on.' Which analysis of the student's work is correct?","options":["The work is correct, because NOT distributes over AND without changing the connective.","The work is correct, because both parts of the statement are negated.","The work is wrong only because the sprinkler part should stay unnegated, giving 'The lawn is not wet and the sprinklers came on'.","The work is wrong because AND must become OR; the correct negation is 'The lawn is not wet or the sprinklers did not come on'."],"answer":3,"explanation":"The negation of A AND B is NOT A OR NOT B. The statement is false when at least one part fails, so only one of the two parts has to fail. The student wrote NOT A AND NOT B, which is the negation of A OR B. Truth-table check: NOT (A AND B) reads F, T, T, T and NOT A OR NOT B reads F, T, T, T, while NOT A AND NOT B reads F, F, F, T.","source":"notes"},{"q":"How many of the 8 rows of the truth table of (P XOR Q) AND R have the value true?","options":["2","4","1","3"],"answer":0,"explanation":"P XOR Q is true in the rows where exactly one of P, Q is true: TF and FT, each with R = T or R = F, so 4 rows. The conjunction with R keeps only the rows with R = T, namely (T, F, T) and (F, T, T), so the answer is 2. The value 4 ignores R, and 3 comes from using OR instead of XOR (rows TTT, TFT, FTT).","source":"notes"},{"q":"Which statement is logically equivalent to NOT (p -> q)?","options":["NOT p AND q","p AND NOT q","NOT p OR NOT q","q -> p"],"answer":1,"explanation":"Use p -> q = NOT p OR q, so NOT (p -> q) = NOT (NOT p OR q) = NOT NOT p AND NOT q = p AND NOT q. Truth-table check in rows TT, TF, FT, FF: p -> q is T, F, T, T, so its negation is F, T, F, F, which matches p AND NOT q. NOT p AND q gives F, F, T, F, NOT p OR NOT q gives F, T, T, T, and q -> p gives T, T, F, T.","source":"notes"}]</script>

<script type="text/plain" id="notes-math100-module4">4 Problem Solving
Problem solving, Polya's four steps, strategies, and heuristics

WHAT IS A PROBLEM AND WHAT IS PROBLEM SOLVING
★ Problem solving means engaging in a task for which the solution method is not known in advance (NCTM, 2000).
★ A problem is a situation in which a person is seeking some goal and for which a suitable course of action is not immediately apparent (Marilyn Burns, 2001).
★ Solving problems takes place when students think flexibly, creatively, and analytically to define, examine, diagnose, and unravel complicated problems.
EASIER: Think of a problem as a locked door when you do not yet have the key. You know where you want to go (the goal), but you do not know how to open the door.
EASIER: If you already know exactly what to do, the task is not a problem for you. It is just a task you can carry out.
EASIER: A task can be a problem for one student and routine for another, because it depends on what the person already knows.
EASIER: Flexibly means you can switch methods when one fails. Creatively means you can come up with new ideas. Analytically means you break the situation into parts and study each part carefully.
EASIER: Define means state clearly what is being asked. Examine means look closely at what is given. Diagnose means figure out what is really going on. Unravel means untangle the problem step by step, like untangling a knot in a string.

MATHEMATICAL PROBLEM SOLVING
★ Mathematical problem-solving is the application of Problem Based Learning to mathematical education, where the students learn mathematics by solving mathematical problems.
★ The mathematical problems used may be non-routine, open-ended, and sometimes connected to real-life applications.
EASIER: Problem Based Learning means you learn the math by working on a puzzle first, instead of memorizing a rule first.
EASIER: Non-routine means the problem is not a copy of an example you have already seen.
EASIER: Open-ended means there may be more than one correct answer or more than one way to reach the answer.
EASIER: A real-life application means the problem comes from a situation outside the classroom, such as time, money, or measurement.

PROBLEM VERSUS EXERCISE
EASIER: These two words sound alike, but they are different. An exercise is like following a recipe you already know. A problem is like inventing the recipe yourself.
EASIER: The key question is this: is the path to the solution clear right away? If yes, it is an exercise. If no, it is a problem.
★ A mathematical exercise tests the student's mastery of a narrowly focused technique, usually one that was recently "covered" in class.
⚙ Characteristic of an exercise: it may be hard or easy, but it is never puzzling, for it is immediately clear how to proceed.
⚙ Characteristic of an exercise: it may involve highly technical work, but the path toward the solution is always apparent.
★ A mathematical problem cannot be solved immediately.
⚙ Characteristic of a problem: it is often open-ended, paradoxical, and sometimes unsolvable.
⚙ Characteristic of a problem: it requires investigation before one comes close to a solution.
EASIER: Paradoxical means it seems to contradict itself at first, so it looks impossible until you think about it carefully.
EASIER: Hard does not mean problem. A long, difficult computation can still be an exercise if you know exactly what steps to take.

EXAMPLE: AN EXERCISE VERSUS A PROBLEM
Added example: Compare the two tasks below.
⚙ Task A: Solve 2x + 6 = 14 right after learning how to solve linear equations.
⚙ Step 1: Subtract 6 from both sides: 2x + 6 - 6 = 14 - 6, so 2x = 8.
⚙ Step 2: Divide both sides by 2: 2x/2 = 8/2, so x = 4.
⚙ Check: 2*4 + 6 = 8 + 6 = 14, which matches the right side.
⚙ Task A is an exercise, because the method is known and every step is clear from the start.
⚙ Task B: Place the digits 1, 2, 3, 4, and 5 in a plus-shaped figure so that the sums across and down are the same (this is Prb-2 below).
⚙ Task B is a problem, because no single known technique tells you where to start. You must investigate first.

POLYA'S FOUR-STEP MODEL
★ George Polya has had an important influence on problem solving in mathematics education.
He noted that good problem solvers tend to forget the details and focus on the structure of the problem, while poor problem solvers do the opposite.
★ Polya's four-step process is: Understand the problem (See), Devise a plan (Plan), Carry out the plan (Do), and Look back (Check).
⚙ Step 1: Understand the problem (See)
⚙ Step 2: Devise a plan (Plan)
⚙ Step 3: Carry out the plan (Do)
⚙ Step 4: Look back (Check)
EASIER: Remember the labels See, Plan, Do, Check in that order. It is like cooking: read the recipe, decide your order of work, cook, then taste the food.
EASIER: Focusing on structure means asking what kind of problem this is, instead of getting lost in the story. The story about Mr. Dong Y. Lhates is really a problem about multiplying and dividing amounts of time.
EASIER: The steps go in order, but you may go back. If your plan fails in Step 3, return to Step 2 and choose a new plan.

STEP 1: UNDERSTAND THE PROBLEM (SEE)
Many students are overwhelmed just by reading a problem. At this point group discussion is beneficial.
Here are questions that may help lead students to an understanding of the problem.
⚙ What are you asked to find or show?
⚙ What type of answer do you expect?
⚙ What units will be used in the answer?
⚙ Can you give an estimate?
⚙ What information is given?
⚙ Is there enough or too little information given?
⚙ Can you restate the problem in your own words?
⚙ Can you draw a picture or diagram to help you understand the problem?
EASIER: Before you calculate anything, make sure you can say in your own words what the problem wants. If you cannot, you are not ready for Step 2.
EASIER: An estimate is a rough guess of the size of the answer. It gives you a way to tell later whether your final answer is sensible.
EASIER: Units are the labels on a number, such as minutes, pesos, or class periods. An answer with the wrong unit is a wrong answer.

STEP 2: DEVISE A PLAN (PLAN)
★ The plan is usually called a strategy.
EASIER: A strategy is your chosen route to the answer, like choosing which road to take before you start driving.
The problem-solving strategies include the following.
⚙ Use a variable
⚙ Make a drawing or diagram
⚙ Look for a pattern
⚙ Construct a table
⚙ Experiment / Identify all possibilities
⚙ Guess and check
⚙ Work backward
⚙ Write an open sentence
⚙ Solve a simpler or similar problem
⚙ Change your point of view / logical reasoning

THE STRATEGIES IN PLAIN WORDS
Use a variable: give the unknown quantity a letter such as x, like an empty box that you will fill in later.
Make a drawing or diagram: sketch the situation so you can see how the parts relate.
Look for a pattern: write the first few cases and look for what repeats or what changes by the same amount each time.
Construct a table: organize the information in rows and columns so patterns and missing values become visible.
Experiment / Identify all possibilities: try the cases in an organized way until you have found every option.
Guess and check: make a sensible guess, test it, and use the result to make a better guess.
Work backward: start from the end result and undo the steps in reverse order.
Write an open sentence: turn the problem into a math sentence with a letter or blank, such as 2x + 6 = 14. It becomes true or false once the blank is filled in.
Solve a simpler or similar problem: try smaller numbers or an easier version to find the idea, then return to the real problem.
Change your point of view / logical reasoning: look at the problem from another angle, or use logic to rule out impossible choices.

HEURISTICS
★ Heuristics (from a Greek word meaning "find" or "discover") are experience-based techniques for problem solving, learning, and discovery.
Examples of this method include using a "rule of thumb", an educated guess, an intuitive judgment, or common sense.
EASIER: A heuristic is a handy tip learned from experience. It often helps, but it does not guarantee an answer.
EASIER: A formula or algorithm always gives the answer if you follow it exactly. A heuristic is only a good direction to try.
EASIER: A strategy is the plan you pick for one particular problem. A heuristic is a general thinking habit that helps you pick that plan.

FOCUS OF HEURISTICS
⚙ Heuristic 1: Searching for a pattern
⚙ Heuristic 2: Drawing a figure
⚙ Heuristic 3: Formulate an equivalent problem
⚙ Heuristic 4: Modify the problem
⚙ Heuristic 5: Choose effective notation
⚙ Heuristic 6: Exploit symmetry
⚙ Heuristic 7: Divide into cases
⚙ Heuristic 8: Work backward (Analyse)
⚙ Heuristic 9: Argue by contradiction
⚙ Heuristic 10: Pursue parity
⚙ Heuristic 11: Consider extreme cases
⚙ Heuristic 12: Generalize

THE TWELVE HEURISTICS IN PLAIN WORDS
Searching for a pattern: list several cases and look for a rule that repeats.
Drawing a figure: a picture often shows relationships that words hide.
Formulate an equivalent problem: restate the problem in a different form that has the same answer but is easier to handle.
Modify the problem: change it a little, for example use smaller numbers or drop one condition, to see how it behaves.
Choose effective notation: pick clear letters and symbols, such as p for the price of a pencil, so your work is easy to read.
Exploit symmetry: if two parts of a problem look the same or can be swapped, solve one part and use the result for the other.
Divide into cases: split the problem into separate situations, such as even and odd, and handle each one.
Work backward (Analyse): start from the goal and ask what must have been true just before it.
Argue by contradiction: assume the opposite of what you want to show, find that it leads to something impossible, and conclude that the original statement is true.
Pursue parity: pay attention to whether numbers are even or odd. Parity means whether a whole number is even or odd.
Consider extreme cases: look at the smallest, largest, or most unusual values, which often reveal how the whole problem works.
Generalize: instead of one specific case, solve the whole family of cases using a letter such as n.

STEP 3: CARRY OUT THE PLAN (DO)
The original strategy may need to be modified. Students need to understand that not every problem will be solved in the first attempt. Cooperative learning teams can be very beneficial at this point.
⚙ Carrying out the plan is usually easier than devising the plan.
⚙ Be patient. Most problems are not solved quickly nor on the first attempt.
⚙ If a plan does not work immediately, be persistent.
⚙ Do not let yourself get discouraged.
⚙ If one strategy is not working, try a different one.
EASIER: Getting stuck is normal. It does not mean you are bad at math. It means you should try another route.

STEP 4: LOOK BACK (CHECK AND REFLECT)
This is simply checking all steps and calculations. Students should be reminded (and reminded) that they should not assume the problem is complete once a solution has been found. Instead, students should examine the problem to ensure that the solution makes sense.
Reflection means thinking back over your work. Use these questions.
⚙ Does your answer make sense?
⚙ Did you answer all of the questions?
⚙ What did you learn by doing this?
⚙ Could you have done this problem another way, maybe even an easier way?
EASIER: Finding an answer is not the end. Checking is like proofreading a message before you send it.
EASIER: One good way to check is to put your answer back into the original problem and see whether it works.

EXAMPLE: PROBLEM 1 MR. DONG Y. LHATES IS LATE TO CLASS
From the lecture slides. The problem: Mr. Dong Y. Lhates was 5 minutes late to his Problem Solving class in UC. His teacher asked him to figure out how many math class periods he would miss in a school year if he was 5 minutes late every meeting. Each class period is 2 hours long and there are 234 days in the school year.
⚙ Step 1 (See): We are asked for the number of math class periods missed in a school year.
⚙ Given: 5 minutes late at every meeting, 2 hours per period, 234 days.
⚙ The answer should be a number of class periods, so the unit is periods.
⚙ Estimate: 5 minutes is a small part of a 120-minute period (about 1 out of 24), so over 234 days the answer should be roughly 234 divided by 24, which is close to 10 periods.
⚙ Step 2 (Plan): The strategy is multiplication and division.
⚙ Plan: change 2 hours to minutes, find the total minutes missed, then divide by the length of one period.
⚙ Step 3 (Do): Change 2 hours to minutes: 2 * 60 = 120 minutes.
⚙ Total minutes missed: 5 * 234 = 1170 minutes, because 5 * 200 = 1000 and 5 * 34 = 170, and 1000 + 170 = 1170.
⚙ Number of periods: 1170 / 120 = 9.75, because 120 * 9 = 1080, then 1170 - 1080 = 90, and 90 / 120 = 0.75.
⚙ Step 4 (Check): Multiply back: 9.75 * 120 = 1080 + 90 = 1170, which matches the total minutes.
⚙ Second check: each meeting loses 5/120 = 1/24 of a period, and 234/24 = 9.75 because 24 * 9 = 216, then 234 - 216 = 18, and 18/24 = 0.75.
⚙ The answer is close to the estimate of 10, so it makes sense.
⚙ Final answer: Mr. Dong Y. Lhates will miss 9.75 math class periods, which is 9 whole periods plus 90 minutes.

EXAMPLE: PROBLEM 2 THE PLUS-SHAPED FIGURE
From the lecture slides. The problem: Copy the figure and place the digits 1, 2, 3, 4, and 5 in the circles so that the sums across (horizontally) and down (vertically) are the same. Is there more than one solution?
The figure has five circles in a plus shape: one at the top, three in the middle row (left, center, right), and one at the bottom. The center circle belongs to both the row and the column.
⚙ Step 1 (See): We must place each digit 1 to 5 exactly once so that the row sum (left + center + right) equals the column sum (top + center + bottom). We must also decide whether more than one solution exists.
⚙ Step 2 (Plan): Use guess and check, organized by the digit placed in the center.
⚙ Step 3 (Do): Try the center as 3. Put 2, 3, 4 across and 1, 3, 5 down. Across: 2 + 3 + 4 = 9. Down: 1 + 3 + 5 = 9. The sums match.
⚙ Try the center as 1. Put 3, 1, 4 across and 5, 1, 2 down. Across: 3 + 1 + 4 = 8. Down: 5 + 1 + 2 = 8. The sums match.
⚙ Try the center as 5. Put 1, 5, 4 across and 2, 5, 3 down. Across: 1 + 5 + 4 = 10. Down: 2 + 5 + 3 = 10. The sums match.
⚙ Step 4 (Check): Every digit 1 to 5 is used exactly once in each arrangement, and each arrangement has equal sums, so each one is a valid solution.
⚙ Final answer: Yes, there is more than one solution. The slides show three with common sums 9, 8, and 10.
Added example: Find every possible solution of Prb-2 using parity (even or odd) and symmetry.
⚙ Step 1: The four outer circles hold the four digits that are not in the center. Let the two row ends add to S and the two column ends add to S, because the row and column sums are equal and share the same center.
⚙ Step 2: So the four outer digits add to 2 * S, which must be an even number.
⚙ Step 3: The total of 1 + 2 + 3 + 4 + 5 is 15. The outer digits add to 15 minus the center digit. For this to be even, the center must be odd.
⚙ Step 4: So the center is 1, 3, or 5. A center of 2 fails because the outer digits 1, 3, 4, 5 add to 13, which is odd. A center of 4 fails because the outer digits 1, 2, 3, 5 add to 11, which is odd.
⚙ Center 1: outer digits 2, 3, 4, 5 add to 14, so S = 7. Pairs adding to 7 are 2 and 5, and 3 and 4. Common sum = 1 + 7 = 8.
⚙ Center 3: outer digits 1, 2, 4, 5 add to 12, so S = 6. Pairs adding to 6 are 1 and 5, and 2 and 4. Common sum = 3 + 6 = 9.
⚙ Center 5: outer digits 1, 2, 3, 4 add to 10, so S = 5. Pairs adding to 5 are 1 and 4, and 2 and 3. Common sum = 5 + 5 = 10.
⚙ Counting: for each valid center, choose which pair goes in the row (2 ways), order that pair left to right (2 ways), and order the other pair top to bottom (2 ways). That gives 2 * 2 * 2 = 8 placements per center.
⚙ Total: 3 centers * 8 placements = 24 placements if every different placement is counted.
⚙ Check: the symmetry of the figure explains the counting, since swapping the row pair and the column pair gives another solution with the same sum.

EXAMPLE: PROBLEM 3 COUNTING RECTANGLES IN A ROW OF SEVEN BOXES
From the lecture slides. The problem: How many rectangles are there in a figure made of 7 equal boxes in one row? A square counts as a rectangle.
⚙ Strategies shown in the slides: draw a diagram, make an organized list, and counting.
⚙ Step 1 (See): We must count every rectangle of every width, including single boxes and the whole row.
⚙ Step 2 (Plan): Draw each possible width and count how many of that width fit in the row.
⚙ Step 3 (Do): Rectangles that are 1 box wide: there are 7.
⚙ Rectangles that are 2 boxes wide: there are 6.
⚙ Rectangles that are 3 boxes wide: there are 5.
⚙ Rectangles that are 4 boxes wide: there are 4.
⚙ Rectangles that are 5 boxes wide: there are 3.
⚙ Rectangles that are 6 boxes wide: there are 2.
⚙ Rectangles that are 7 boxes wide: there is 1.
⚙ Total: 7 + 6 + 5 + 4 + 3 + 2 + 1 = 28, because 7 + 6 = 13, 13 + 5 = 18, 18 + 4 = 22, 22 + 3 = 25, 25 + 2 = 27, and 27 + 1 = 28.
⚙ Step 4 (Check): The shortcut n(n + 1)/2 with n = 7 gives 7 * 8 / 2 = 56 / 2 = 28, which agrees.
⚙ Final answer: There are 28 rectangles. In the slide drawing the numbers beside the bars go from 7 for the one-box bar down to 1 for the whole-row bar, which is the same counting.
★ For a row of n equal boxes, the number of rectangles is n + (n - 1) + ... + 2 + 1, which equals n(n + 1)/2.
EASIER: Each possible starting edge and ending edge of a rectangle makes one rectangle. A row of n boxes has n + 1 vertical lines, and choosing 2 of them gives n(n + 1)/2 rectangles.
Added example: How many rectangles are in a row of 5 boxes?
⚙ Count by width: 5 + 4 + 3 + 2 + 1 = 15.
⚙ Check with the shortcut: 5 * 6 / 2 = 30 / 2 = 15. Both methods agree.

EXAMPLE: USE A VARIABLE AND WRITE AN OPEN SENTENCE
Added example: A notebook and a pencil cost 35 pesos together. The notebook costs 15 pesos more than the pencil. Find each price.
⚙ Step 1 (See): We need two prices. Given: the total is 35 and the notebook costs 15 more.
⚙ Step 2 (Plan): Let p be the price of the pencil in pesos. Then the notebook costs p + 15.
⚙ Step 3 (Do): Write the open sentence: p + (p + 15) = 35.
⚙ Combine like terms: 2p + 15 = 35.
⚙ Subtract 15 from both sides: 2p = 20.
⚙ Divide both sides by 2: p = 10.
⚙ Notebook price: p + 15 = 10 + 15 = 25.
⚙ Step 4 (Check): 10 + 25 = 35, which matches the total. 25 - 10 = 15, which matches the difference.
⚙ Final answer: the pencil costs 10 pesos and the notebook costs 25 pesos.

EXAMPLE: WORK BACKWARD
Added example: I think of a number, multiply it by 3, subtract 4, and get 20. What is my number?
⚙ Step 1: Undo the last operation. The last step was subtract 4, so add 4: 20 + 4 = 24.
⚙ Step 2: Undo the first operation. The first step was multiply by 3, so divide by 3: 24 / 3 = 8.
⚙ Check: Start with 8. Multiply by 3: 8 * 3 = 24. Subtract 4: 24 - 4 = 20, which matches.
⚙ Final answer: the number is 8.

EXAMPLE: GUESS AND CHECK
Added example: Find two whole numbers whose sum is 12 and whose product is 35.
⚙ Guess 1 and 11: sum 12, product 11. The product is too small.
⚙ Guess 2 and 10: sum 12, product 20. Still too small.
⚙ Guess 3 and 9: sum 12, product 27. Still too small.
⚙ Guess 4 and 8: sum 12, product 32. Still too small, but closer.
⚙ Guess 5 and 7: sum 12, product 35. This matches both conditions.
⚙ Final answer: the numbers are 5 and 7.

EXAMPLE: LOOK FOR A PATTERN AND CONSTRUCT A TABLE
Added example: Find the 10th term of the list 3, 7, 11, 15, and so on.
⚙ Step 1: Build a table with the term number n and the value. n = 1 gives 3, n = 2 gives 7, n = 3 gives 11, n = 4 gives 15.
⚙ Step 2: Find the differences: 7 - 3 = 4, 11 - 7 = 4, 15 - 11 = 4. The list goes up by 4 each time.
⚙ Step 3: Write the rule: the nth term is 4n - 1.
⚙ Check the rule: n = 1 gives 4 * 1 - 1 = 3, and n = 4 gives 4 * 4 - 1 = 15. Both match.
⚙ Step 4: For n = 10, the term is 4 * 10 - 1 = 39.
⚙ Second check: starting at 3 and adding 4 nine times gives 3 + 9 * 4 = 3 + 36 = 39.
⚙ Final answer: the 10th term is 39.

EXAMPLE: PURSUE PARITY
Added example: Can five odd numbers add up to 20?
⚙ Step 1: An odd number plus an odd number is even. For example 3 + 5 = 8.
⚙ Step 2: So four odd numbers add to an even number, because two pairs of odd numbers each give an even sum, and even + even = even.
⚙ Step 3: Adding the fifth odd number to an even sum gives an odd sum.
⚙ Step 4: So the sum of any five odd numbers is odd, and 20 is even.
⚙ Check with a real case: 1 + 3 + 5 + 7 + 9 = 25, which is odd.
⚙ Final answer: No, five odd numbers can never add up to 20.

EXAMPLE: ARGUE BY CONTRADICTION
Added example: Show that there is no largest whole number.
⚙ Step 1: Assume the opposite, that there is a largest whole number, and call it N.
⚙ Step 2: Then N + 1 is also a whole number.
⚙ Step 3: But N + 1 is greater than N, which contradicts the assumption that N is the largest.
⚙ Step 4: The assumption leads to something impossible, so it must be false.
⚙ Final answer: there is no largest whole number.

COMMON MISTAKES
Confusing an exercise with a problem. An exercise has an obvious path. A problem does not.
Starting to calculate before understanding what the problem asks. Always do Step 1 first.
Forgetting to change units. In Problem 1, using 1 hour as 60 minutes instead of using 2 hours as 120 minutes gives 1170 / 60 = 19.5 periods, which is wrong.
Stopping as soon as an answer is found. Always do Step 4 and check that the answer makes sense.
Giving up when the first strategy fails. Switch to another strategy instead.
Treating a heuristic as a guaranteed method. A heuristic is a helpful guide, not a guarantee.
In rectangle counting, forgetting to count the larger rectangles made of several boxes, or forgetting that the whole figure is also a rectangle.

EXAM TIPS
Memorize the order of Polya's steps with the labels: See, Plan, Do, Check.
Be ready to tell an exercise from a problem by asking whether the path to the solution is clear right away.
Be able to name at least the ten problem-solving strategies and the twelve heuristics.
When you solve a numeric problem, write the estimate, the steps, the check, and the final answer with units.
For the three lecture problems, remember the answers: Problem 1 gives 9.75 periods, Problem 2 has more than one solution, and Problem 3 gives 28 rectangles.

SELF TEST
Q: What is problem solving according to NCTM (2000)?
★ Engaging in a task for which the solution method is not known in advance.
Q: What are Polya's four steps and their labels?
★ Understand the problem (See), Devise a plan (Plan), Carry out the plan (Do), Look back (Check).
Q: How is a mathematical exercise different from a mathematical problem?
★ In an exercise the path to the solution is immediately clear and tests a narrowly focused technique. A problem cannot be solved immediately and needs investigation first.
Q: What does the word heuristics mean and what does it refer to?
★ It comes from a Greek word meaning find or discover, and it refers to experience-based techniques such as a rule of thumb, an educated guess, an intuitive judgment, or common sense.
Q: How many class periods are missed if a student is 5 minutes late to every meeting of 2-hour periods over 234 days?
★ 5 * 234 = 1170 minutes, and 1170 / 120 = 9.75 periods.
Q: In the plus-shaped figure with digits 1 to 5, can the center digit be 2?
★ No. The outer digits would be 1, 3, 4, 5 with total 13, which is odd and cannot be split into two equal-sum pairs.
Q: How many rectangles are in a row of 7 boxes?
★ 7 + 6 + 5 + 4 + 3 + 2 + 1 = 28, which also equals 7 * 8 / 2.
Q: What should you do in Step 4 (Look back)?
★ Check all steps and calculations and ask whether the answer makes sense, whether all questions were answered, what you learned, and whether another or easier way exists.</script>
<script type="application/json" id="quiz-math100-module4">[{"q":"Which statement matches the NCTM (2000) definition of problem solving?","options":["Applying a technique that was recently covered in class to a familiar task","Checking all steps and calculations after an answer has been found","Engaging in a task for which the solution method is not known in advance","Using a rule of thumb or an educated guess to discover a result"],"answer":2,"explanation":"NCTM (2000) defines problem solving as engaging in a task for which the solution method is not known in advance. Applying a recently covered technique describes an exercise, checking calculations describes Polya's Step 4, and a rule of thumb or educated guess describes a heuristic.","source":"notes"},{"q":"A situation in which a person is seeking some goal and for which a suitable course of action is not immediately apparent is called a(n)","options":["exercise","problem","heuristic","strategy"],"answer":1,"explanation":"This is Marilyn Burns's (2001) definition of a problem. An exercise has an immediately clear path, a heuristic is an experience-based technique, and a strategy is the plan chosen in Polya's second step.","source":"notes"},{"q":"The word heuristics, taken from a Greek word meaning find or discover, refers to","options":["experience-based techniques for problem solving, learning, and discovery","step-by-step procedures that always guarantee a correct answer","the final step of Polya's model, in which all calculations are rechecked","tasks that test mastery of a narrowly focused technique recently covered"],"answer":0,"explanation":"Heuristics are experience-based techniques such as a rule of thumb, an educated guess, an intuitive judgment, or common sense. They do not guarantee an answer, so the second option is wrong. Rechecking is Step 4 (Look back), and the last option describes an exercise.","source":"notes"},{"q":"Mathematical problem-solving is best described as","options":["memorizing a list of formulas so that every task can be finished immediately","a set of routine drills built around the most recently covered technique","a method that applies only to real-life word problems that have one fixed answer","the application of Problem Based Learning to mathematical education using problems that may be non-routine, open-ended, and sometimes real-life"],"answer":3,"explanation":"Mathematical problem-solving applies Problem Based Learning to mathematics, and students learn by solving problems that may be non-routine, open-ended, and sometimes tied to real life. Memorized formulas and routine drills describe exercises, and the problems are not limited to real-life word problems with one fixed answer.","source":"notes"},{"q":"In Polya's model, the plan devised in the second step is usually called a","options":["strategy","exercise","reflection","estimate"],"answer":0,"explanation":"The plan is usually called a strategy, for example use a variable, work backward, or guess and check. An exercise is a type of task, reflection belongs to Step 4, and an estimate is a rough guess of the answer made in Step 1.","source":"notes"},{"q":"Which pairing of Polya step and its label is correct?","options":["Understand the problem - Check","Carry out the plan - Plan","Look back - See","Devise a plan - Plan"],"answer":3,"explanation":"The labels are Understand the problem (See), Devise a plan (Plan), Carry out the plan (Do), and Look back (Check). In the wrong options the labels Check, Plan, and See are attached to the wrong steps.","source":"notes"},{"q":"A row of n equal boxes placed side by side contains how many rectangles of all possible widths, counting the whole row?","options":["n^2/2","n(n-1)/2","n(n+1)/2","2n"],"answer":2,"explanation":"The count is n + (n-1) + ... + 2 + 1 = n(n+1)/2. For n = 7 this gives 7*8/2 = 28, which matches 7+6+5+4+3+2+1. The other formulas give 24.5, 21, and 14 for n = 7, none of which is the correct count of 28.","source":"notes"},{"q":"Which of the following is one of the twelve focus areas of heuristics?","options":["Memorize every formula before starting","Exploit symmetry","Avoid drawing figures","Stop after the first correct answer"],"answer":1,"explanation":"The twelve heuristics include searching for a pattern, drawing a figure, formulating an equivalent problem, modifying the problem, choosing effective notation, exploiting symmetry, dividing into cases, working backward, arguing by contradiction, pursuing parity, considering extreme cases, and generalizing. The other options are not on the list and go against good problem-solving habits.","source":"notes"},{"q":"Which sequence lists Polya's four steps in the correct order?","options":["Plan, See, Do, Check","See, Plan, Do, Check","See, Do, Plan, Check","Plan, Do, Check, See"],"answer":1,"explanation":"The order is Understand the problem (See), Devise a plan (Plan), Carry out the plan (Do), and Look back (Check). You must understand the problem before planning, and plan before carrying out the work, so the other orders are wrong.","source":"notes"},{"q":"A student is 5 minutes late to every meeting of a class with 2-hour periods, and there are 234 class days. Which order of computations correctly finds the number of periods missed?","options":["Divide 5 by 234, then multiply the result by 2","Multiply 234 by 2, then divide the result by 5","Divide 234 by 5, then divide the result by 120","Change 2 hours to 120 minutes, multiply 5 by 234, then divide the total minutes by 120"],"answer":3,"explanation":"Convert the period length to 120 minutes, find the total minutes missed as 5*234 = 1170, then divide by 120 to get 9.75 periods. The other orders mix up units or divide by the wrong quantity and do not give 9.75.","source":"notes"},{"q":"Which statement is NOT true of a mathematical problem?","options":["The path toward the solution is always apparent from the start","It cannot be solved immediately","It is often open-ended, paradoxical, and sometimes unsolvable","It requires investigation before one comes close to a solution"],"answer":0,"explanation":"An apparent path from the start is a characteristic of an exercise, not of a problem. A problem cannot be solved immediately, is often open-ended, paradoxical, and sometimes unsolvable, and requires investigation first.","source":"notes"},{"q":"Which pair is mismatched?","options":["Exercise - the path toward the solution is always apparent","Heuristic - a rule of thumb or an educated guess","Step 1 Understand - ask what information is given and what you are asked to find","Step 4 Look back - assume the problem is finished as soon as an answer is found"],"answer":3,"explanation":"In Step 4 you should not assume the problem is complete once a solution is found. You check all steps and calculations and make sure the solution makes sense. The other three pairs are correct matches.","source":"notes"},{"q":"A student is 10 minutes late to every meeting of a 90-minute class, and the class meets 180 times in a year. How many class periods of time does the student miss in total?","options":["30","18","20","200"],"answer":2,"explanation":"Total minutes missed = 10*180 = 1800. Periods = 1800/90 = 20. Check: 20*90 = 1800. Dividing by 60 gives 30, which wrongly uses a 60-minute period. Dividing 180 by 10 gives 18, which does not use the period length. Dividing 1800 by 9 gives 200, which is a place-value error.","source":"notes"},{"q":"The digits 1, 2, 3, 4, and 5 are each used once in a plus-shaped figure with 5 circles (one on top, three across the middle, one at the bottom), and the sum across equals the sum down. If the center digit is 3, what is the common sum?","options":["12","9","6","10"],"answer":1,"explanation":"The four outer digits are 1, 2, 4, 5 with total 12. The row ends and the column ends must each add to half of that, which is 6. The common sum is 3 + 6 = 9. For example 2+3+4 = 9 and 1+3+5 = 9. The value 6 forgets the center, 12 is the total of the outer digits, and 10 is the common sum when the center is 5.","source":"notes"},{"q":"How many rectangles of all sizes are in a row of 9 equal boxes?","options":["81","36","45","90"],"answer":2,"explanation":"The count is 9+8+7+6+5+4+3+2+1 = 45, which equals 9*10/2 = 45. The value 81 is 9^2, 36 is 8*9/2 (using n-1 instead of n), and 90 is 9*10 without dividing by 2.","source":"notes"},{"q":"I think of a number, multiply it by 3, subtract 4, and get 20. Using the strategy of working backward, what is my number?","options":["8","24","72","16/3"],"answer":0,"explanation":"Undo the steps in reverse order: 20 + 4 = 24, then 24/3 = 8. Check: 8*3 = 24 and 24 - 4 = 20. The value 24 skips the division by 3, 72 multiplies by 3 instead of dividing, and 16/3 subtracts 4 instead of adding it.","source":"notes"},{"q":"A student assumes that a largest whole number N exists, then observes that N + 1 is also a whole number greater than N and rejects the assumption. Which heuristic is the student using?","options":["Work backward.","Search for a pattern.","Guess and check.","Argue by contradiction."],"answer":3,"explanation":"The student assumes the opposite of the desired conclusion and derives an impossibility: N + 1 would exceed the supposed largest whole number. This is arguing by contradiction, not reversing operations, extending a pattern, or testing guesses.","source":"notes"},{"q":"A notebook costs 15 pesos more than a pencil, and together they cost 35 pesos. Using p for the pencil price, what is the pencil price?","options":["10 pesos","15 pesos","20 pesos","25 pesos"],"answer":0,"explanation":"The open sentence is p + (p + 15) = 35. Then 2p + 15 = 35, 2p = 20, and p = 10. Check: the notebook costs 25, the total is 35, and the difference is 15. The other listed amounts do not satisfy both conditions as the pencil price.","source":"notes"},{"q":"Which statement distinguishes a strategy from a heuristic?","options":["A strategy is a formula that guarantees an answer; a heuristic is a truth table.","A strategy is a general rule of thumb, while a heuristic is a specific route chosen for one problem.","A strategy is the plan chosen for a particular problem; a heuristic is a general experience-based aid that may help without guaranteeing a solution.","A strategy and a heuristic are identical terms for an algorithm that always works."],"answer":2,"explanation":"A strategy is the plan selected for a particular problem. A heuristic is a broader, experience-based technique that can guide problem solving but does not guarantee success. The other choices reverse the terms or incorrectly make heuristics guaranteed algorithms.","source":"notes"},{"q":"Which statement about heuristics is NOT true?","options":["A heuristic can be an experience-based technique for discovery.","A heuristic guarantees the answer whenever it is followed exactly, just like an algorithm.","A heuristic can be a general thinking aid for selecting a strategy.","A heuristic may point toward a useful approach without ensuring that it succeeds."],"answer":1,"explanation":"A heuristic is a helpful direction based on experience, but it does not guarantee an answer. The guarantee described belongs to an algorithm or formula followed exactly. The other statements match the notes' description of heuristics.","source":"notes"},{"q":"A mathematical task that tests the student's mastery of a narrowly focused technique, usually one recently covered in class, and for which it is immediately clear how to proceed, is called a(n)","options":["exercise","open sentence","estimate","reflection"],"answer":0,"explanation":"An exercise may be easy or hard, but the path toward the solution is always apparent, for example solving 2x + 6 = 14 right after learning linear equations. An open sentence is a math sentence with a blank or letter, an estimate is a rough guess of the size of an answer, and reflection is the thinking done in the look-back step.","source":"notes"},{"q":"Which heuristic restates a problem in a different form that has the same answer but is easier to handle?","options":["Modify the problem","Formulate an equivalent problem","Choose effective notation","Generalize"],"answer":1,"explanation":"Formulating an equivalent problem keeps the same answer while changing the form. Modifying the problem changes it a little, such as using smaller numbers or dropping a condition, so the answer may change. Choosing effective notation means picking clear letters and symbols, and generalizing means solving the whole family of cases with a letter such as n.","source":"notes"},{"q":"Which statement describes how good problem solvers differ from poor problem solvers, as observed by George Polya?","options":["They memorize more details of the story so that no information is lost","They avoid drawing figures so that attention stays on the numbers","They tend to forget the details and focus on the structure of the problem","They begin calculating immediately and examine the structure afterward"],"answer":2,"explanation":"Polya noted that good problem solvers focus on the structure of the problem and poor problem solvers do the opposite. For example, the story of a student who is late to class is really a problem about multiplying and dividing amounts of time. Starting to calculate before understanding the problem is listed as a common mistake.","source":"notes"},{"q":"Which question belongs to Step 4 (Look back) of Polya's model?","options":["Can you restate the problem in your own words?","What type of answer do you expect?","What information is given?","Did you answer all of the questions?"],"answer":3,"explanation":"The look-back questions are: Does your answer make sense? Did you answer all of the questions? What did you learn? Could you have done it another way? The other three questions belong to Step 1 (See), where the solver works out what is asked and what is given.","source":"notes"},{"q":"Which order correctly describes solving a word problem by using a variable and an open sentence?","options":["Let a letter stand for the unknown; write the open sentence; solve it; check in the original problem","Write the open sentence; let a letter stand for the unknown; solve it; check in the original problem","Solve for the unknown; write the open sentence; let a letter stand for it; check in the original problem","Let a letter stand for the unknown; solve for it; write the open sentence; check in the original problem"],"answer":0,"explanation":"The letter must exist before an open sentence can be written, and the sentence must exist before it can be solved. Example: let p be the pencil price, write p + (p + 15) = 35, solve 2p + 15 = 35 to get p = 10, then check 10 + 25 = 35 and 25 - 10 = 15.","source":"notes"},{"q":"Which order of steps correctly shows that a statement is true by arguing by contradiction?","options":["Assume the statement is true; derive consequences; find an impossibility; conclude that the statement is false","Assume the opposite of the statement; derive consequences; reach an impossibility; conclude that the statement is true","Reach an impossibility; assume the opposite of the statement; derive consequences; conclude that the statement is true","Derive consequences; assume the opposite of the statement; conclude that the statement is true; reach an impossibility"],"answer":1,"explanation":"Example: to show there is no largest whole number, assume there is one, N; then N + 1 is a larger whole number, which is impossible, so the assumption is false and the original statement is true. The impossibility can only be reached after the opposite has been assumed and its consequences derived.","source":"notes"},{"q":"Which statement about Step 3 (Carry out the plan) is NOT true?","options":["If one strategy is not working, a different one should be tried.","Most problems are not solved quickly or on the first attempt.","Carrying out the plan is usually harder than devising the plan.","The original strategy may need to be modified while working."],"answer":2,"explanation":"Carrying out the plan is usually easier than devising it, so the third statement is false. The other three are true: persistence is expected, switching strategies is normal, and a plan may need to be modified.","source":"notes"},{"q":"A student argues that five odd numbers can add up to 20: 'An odd number plus an odd number is even, so a sum of odd numbers is even, and 20 is even.' Which analysis of this argument is correct?","options":["The argument is correct, because odd + odd is even and the same reasoning extends to any number of odd numbers.","The argument is wrong, because odd + odd is odd, so the sum of five odd numbers is odd.","The argument is wrong, because 20 is too large to be written as a sum of five odd numbers.","The step is misapplied: four odd numbers give an even sum, but a fifth odd number makes the total odd, so 20 is impossible."],"answer":3,"explanation":"Odd + odd is even, so pairs of odd numbers give even sums and four odd numbers give an even sum. Adding a fifth odd number to an even sum gives an odd sum, so five odd numbers never add to the even number 20. Check: 1 + 3 + 5 + 7 + 9 = 25, which is odd. The claim that odd + odd is odd is false, and size is not the reason for the impossibility.","source":"notes"},{"q":"A student looks for two whole numbers with sum 12 and product 35, tries 4 and 8, gets product 32, and concludes that no such numbers exist. Which analysis is correct?","options":["The conclusion is correct, because 32 is not 35 and the guess already satisfied the sum.","The conclusion is wrong, because guess and check uses each result to improve the next guess, and 5 and 7 give sum 12 and product 35.","The conclusion is wrong, because 6 and 6 give sum 12 and product 35.","The conclusion is wrong, because 3 and 9 give sum 12 and product 35."],"answer":1,"explanation":"One failed guess does not show that no solution exists. The product 32 is too small but closer than 27, so the next guess should move toward 5 and 7: 5 + 7 = 12 and 5 * 7 = 35. The pair 6 and 6 gives product 36, and 3 and 9 gives product 27.","source":"notes"},{"q":"A list begins 5, 9, 13, 17 and continues by the same rule. Using a table and a pattern, what is the 25th term?","options":["101","100","105","97"],"answer":0,"explanation":"The differences are 4, 4, 4, so the nth term is 5 + 4(n - 1) = 4n + 1, and n = 25 gives 101. Second check: 5 + 24 * 4 = 5 + 96 = 101. The value 100 drops the + 1 (4n), 105 adds 4 twenty-five times to 5 (using n instead of n - 1), and 97 is the 24th term.","source":"notes"}]</script>

<script type="text/plain" id="notes-eng100-lecture4">
Lesson 4 Register and Tone in Spoken and Written Communication
Course ENG100, taught by Kristine Castillo MA-ESL

CLASS OBJECTIVES
⚙ Objective 1: Understand the concepts of register and tone in communication.
⚙ Objective 2: Differentiate between formal and informal registers and tones for an effective communication.
⚙ Objective 3: Apply appropriate register and tone in spoken and written communication.
EASIER: In simple words, first learn what register and tone are, then learn how formal and informal differ, then use the right one when you speak and write.

EXAMPLE: HOW WE GREET DIFFERENT PEOPLE
The lecture opens with three greetings, each used with a different person.
It is an honor to meet you Mr. President. This is very respectful because the listener is the President.
My pleasure to meet you, Sir. This is polite and respectful, shown in a handshake between two people.
Hey sis! This is relaxed and friendly because the listener is a sister.
EASIER: The idea (greeting someone) stays the same, but the words change because the listener changes.

LANGUAGE REGISTERS
★ Language register: the level of formality and style of our speech and writing.
★ A register should be appropriate to the situation we are in.
★ The parts of a situation are audience, topic, purpose, and location.
★ Different situations call for different registers.
EASIER: Register is like choosing clothes. You wear different clothes to a funeral, a classroom, and a beach, and you choose different words for each place and person too.

AUDIENCE
★ Audience is one of the four parts of a situation that decide the register.
EASIER: Audience means the people you are speaking or writing to.
EXAMPLE: AUDIENCE
Ms. Castillo, may we know our exam scores? This is polite and is said to a teacher.
Hey! Dude/bro. This is casual and is said to a friend.

TOPIC
★ Topic is one of the four parts of a situation that decide the register.
EASIER: Topic means the subject being talked or written about.
Added example: Talking about an illness with a doctor uses more careful words than talking about a game with friends.

PURPOSE
★ Purpose is one of the four parts of a situation that decide the register.
★ The author's purposes shown in the lecture are inform, entertain, persuade, and describe.
EASIER: Purpose means why you are speaking or writing.

LOCATION
★ Location is one of the four parts of a situation that decide the register.
EASIER: Location means the place where the communication happens.
Added example: A school library, a coffee shop, and a mall each call for different language.

QUESTIONS A WRITER ASKS
⚙ Step 1: Ask "Why am I writing this?" This question is about purpose.
⚙ Step 2: Ask "Who am I writing this for?" This question is about audience.
⚙ Step 3: Ask "So what sort of writing will suit this purpose?" This question is about form.
⚙ Step 4: Ask "So what style do I need to write in?" This question is about style.
EASIER: Memory trick: purpose first, then audience, then form, then style.

KINDS OF LANGUAGE REGISTERS
★ The five kinds of language registers, in lecture order, are static, formal, consultative, casual, and intimate.
EASIER: Memory trick: the list goes from the most fixed language (static) to the most private language (intimate).

STATIC REGISTER
★ Static register rarely or never changes.
★ Static register is frozen in time in form and content.
★ Static register is extremely formal language that must be said the same each time we say it.
★ Examples of static register: National Anthem, The Lord's Prayer, Pledge of Allegiance, Preamble of the Philippine Constitution, and Law.
EASIER: Static means not moving. You cannot change even one word when you recite the Pledge of Allegiance.

FORMAL REGISTER
★ Formal register is used in a formal setting and is one way in nature.
★ The use of language in formal register usually follows a commonly accepted format.
★ Formal register is usually impersonal and formal, and it includes academic language.
★ Examples of formal register: sermons, rhetorical statements and questions in speeches, pronouncement by the judges, and announcement.
EASIER: One way means one person speaks and the audience listens, like a pastor giving a sermon.
EASIER: Impersonal means it does not sound like a private chat between two close people.

RULES OF THE FORMAL REGISTER
⚙ Rule 1: Do not use contractions.
⚙ Rule 2: Avoid using slang, idioms, and exaggerations.
⚙ Rule 3: Avoid using too much passive voice.
EASIER: A contraction is a shortened word such as "don't". In formal register write "do not" instead.
EASIER: Slang is very casual word use such as "dude". An idiom is a phrase whose meaning is not literal. An exaggeration says something is bigger or worse than it really is.
EASIER: Passive voice puts the receiver of the action first. Active voice is more direct.
Added example: Passive: "The report was written by me." Active: "I wrote the report."

CONSULTATIVE REGISTER
★ Consultative register is the standard form of communications.
★ In consultative register, users engage in a mutually accepted structure of communications.
★ In consultative register, formal and societal expectations accompany the users of the speech.
★ Consultative register is professional discourse or acceptable speech used in professional settings.
★ Pairs that use consultative register: superior and subordinate, doctor and patient, lawyer and client, and teacher and student.
EASIER: Consultative comes from the idea of consulting a professional. Both sides follow polite, accepted rules when they talk.

CASUAL REGISTER
★ Casual register is informal language used by peers and friends.
★ In casual register, slang, vulgarities, and colloquialisms are normal during communication.
★ Examples of casual register: friends or buddies, team mates, group chats, message to friends, blogs, and advertisements.
EASIER: A colloquialism is an everyday spoken expression. A vulgarity is a rude or crude word. These are normal among friends but not in formal situations.

INTIMATE REGISTER
★ Intimate register is private communication.
★ Intimate register is reserved for close family members or intimate people.
★ In intimate register, intonation is more important than wording or grammar.
★ Pairs that use intimate register: husband and wife, boyfriend and girlfriend, siblings, and parent and children.
EASIER: Intonation is the rise and fall of your voice. Between very close people, how you say something matters more than the exact words.

SIMILAR TERMS STUDENTS CONFUSE
Difference: Static register never changes at all, while formal register follows a common format but the wording can still change.
Difference: Formal register is one way in nature, while consultative register is an exchange in which the users engage with each other in a professional setting.
Difference: Casual register is for peers and friends, while intimate register is private and reserved for close family members or intimate people.
Difference: In casual register the wording (slang and colloquialisms) is normal, while in intimate register intonation matters more than wording or grammar.
Difference: Register is the level of formality and style of language, while tone is the attitude or emotion conveyed.
Difference: Formal register is a kind of register, while formal tone is a kind of tone. They are two different ideas.

TONE
★ Tone: the attitude, emotion, or style conveyed in communication.
★ Tone is described as the way a person speaks to someone.
EASIER: The words "Come here" can sound angry or kind. The difference is the tone.

TONE IN SPOKEN COMMUNICATION
★ There are six kinds of spoken tone: formal, informal, authoritative, friendly, expressive, and neutral.
★ Spoken formal tone: polite, respectful, following proper etiquette. Example: giving a presentation in a professional setting.
★ Spoken informal tone: casual, relaxed, conversational. Example: chatting with friends or family.
★ Spoken authoritative tone: confident, assertive, commanding. Example: giving instructions or directions.
★ Spoken friendly tone: warm, approachable, amicable. Example: talking to colleagues during a break.
★ Spoken expressive tone: emotionally charged, passionate. Example: delivering a speech on a topic of personal significance, advertisements or commercials.
★ Spoken neutral tone: unbiased, objective, without emotional emphasis. Example: reporting facts or information without personal opinion.
EASIER: Amicable means friendly and peaceful. Assertive means saying what you want with confidence. Objective means based on facts, not feelings.

TONE IN WRITTEN COMMUNICATION
★ There are seven kinds of written tone: formal, informal, sympathetic, instructive, humorous, critical, and persuasive.
★ Written formal tone: proper grammar, professional language, and structured writing. Examples: business emails and academic papers.
★ Written informal tone: conversational language, relaxed structure, may include colloquialisms. Examples: personal emails and text messages to friends.
★ Written sympathetic tone: compassionate, understanding, empathetic. Example: writing a condolence letter.
★ Written instructive tone: clear instructions and step-by-step guidance. Examples: manuals and how-to guides.
★ Written humorous tone: playful, funny, lighthearted. Examples: comic strips and some advertisements.
★ Written critical tone: analytical, evaluative, may include constructive criticism. Examples: academic critiques and performance reviews.
★ Written persuasive tone: convincing, compelling, using rhetorical strategies. Examples: persuasive essays and advertising copy.
EASIER: A condolence letter is a letter that comforts someone who lost a loved one. Empathetic means you understand and share the other person's feelings.
EASIER: Rhetorical strategies are speaking or writing techniques that help convince people.

TONES THAT STUDENTS CONFUSE
Difference: Authoritative tone is spoken and commanding, while instructive tone is written and gives step-by-step guidance.
Difference: Expressive tone is emotionally charged and passionate, while neutral tone has no emotional emphasis.
Difference: Sympathetic tone comforts and understands, while critical tone analyzes and evaluates.
Difference: Humorous tone aims to be playful, while persuasive tone aims to convince.
Difference: Advertisements appear in several places: casual register, spoken expressive tone, written humorous tone, and written persuasive tone.

EXAMPLE: EXIT TICKET ROLE PLAY
⚙ Step 1: Group into 5 members.
⚙ Step 2: Choose either Formal or Informal Language Registers.
⚙ Step 3: Make the role play 2 to 3 minutes long.
★ Rubric: Clarity of Content is 5 points.
★ Rubric: Appropriate Tone and Register is 10 points.
★ Rubric: Overall performance is 5 points.
Added example: The three rubric parts add up to 20 points in total.

COMMON MISTAKES
Mixing up register and tone. Register is the level of formality and style, and tone is the attitude or emotion.
Thinking static register can be reworded. It must be said the same each time.
Using contractions, slang, or idioms in formal register.
Placing consultative register under casual. Teacher and student, doctor and patient, lawyer and client, and superior and subordinate are consultative.
Forgetting that written tone has seven kinds, while spoken tone has six.

EXAM TIPS
Memorize the five registers in order: static, formal, consultative, casual, intimate.
Memorize the three formal register rules: no contractions, no slang or idioms or exaggerations, not too much passive voice.
Memorize the four parts of a situation: audience, topic, purpose, location.
Memorize each tone with its key words and its example.

SELF-TEST
Q: What is a language register?
★ The level of formality and style of our speech and writing.
Q: What are the four parts of a situation that decide the register?
★ Audience, topic, purpose, and location.
Q: Which register must be said the same each time?
★ Static register.
Q: Which register is private and reserved for close family or intimate people?
★ Intimate register.
Q: Which written tone is used in a condolence letter?
★ Sympathetic tone.
Q: Which spoken tone is warm, approachable, and amicable?
★ Friendly tone.

REFERENCE
Source of the lecture: GE Com - Module 6: Varieties and registers of spoken and written languages. (n.d.). https://sites.google.com/deped.gov.ph/ckcstpurposivecommunication/mid-term/module-6-varietiesand-registers-of-spoken-and-written-languages
</script>
