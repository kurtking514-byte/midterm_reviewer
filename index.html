3 Decision Control Structure
CC2 Introduction to Computer Programming: Python conditionals, nested conditionals, and match case

1. Conditionals and Boolean values
★ Conditional expressions use the keywords if, elif, and else to let a Python program perform different actions depending on a Boolean condition (True or False)
★ Boolean: a value that is one of two values, True or False
Any expression in Python can be evaluated to give True or False
When two values are compared, the expression is evaluated and Python returns the Boolean answer
A Boolean can be declared as a variable, for example test = True
A Boolean can be the result of an expression, as in the next six lines
print(10 > 9) # Outputs True
print(10 == 0) # Outputs False
print(10 < 9) # Outputs False
print(10 >= 9) # Outputs True
print(10 <= 9) # Outputs False
print(10 != 10) # Outputs False
⚙ not negates (reverses) the value of a Boolean variable
Example: test = True, then print(not test) outputs False

2. The and and or operators
★ and operator: a special operator that judges whether all arguments in a set are True
★ or operator: a special operator that judges whether at least one argument in a set is True
⚙ With Booleans, x and y is True only when both are True, otherwise it is False
Example: True and True gives True, True and False gives False
⚙ With Booleans, x or y is True when at least one is True, and False only when both are False
Example: True or False gives True, False or False gives False
⚙ and with numbers or strings: if both arguments are True (not 0 and not an empty string) it evaluates to the second argument
⚙ Otherwise, and evaluates to the first False argument
Example: x = 1, y = 2, z = x and y gives z = 2 (the second value)
Example: x = 0, y = 1, z = x and y gives z = 0 (the first False argument)
⚙ or with numbers or strings: if at least one argument is True it evaluates to the first True argument
⚙ Otherwise (both are False) or evaluates to the second argument
Example: x = 1, y = 0, z = x or y gives z = 1
Example: x = 0, y = 0, z = x or y gives z = 0 (the second argument)
EASIER: and hands back the first False value it meets, or the second value if none is False; or hands back the first True value it meets, or the second value if none is True

3. The IF statement
★ IF statement: one of the most used conditional statements, it decides whether certain statements are executed or not
⚙ IF checks a condition: if it is True the body (block) is executed, if it is False the body is skipped
⚙ IF syntax: the line if condition: followed by an indented body
Example: if True: print("It is true!") outputs It is true!
Example: if False: print("This won't get printed.") prints nothing
The condition can be any valid expression, for example if 2 + 2 == 4: print("I know math!") outputs I know math!
Variables can be used in the condition: x = 10, then if(x < 15): prints Number is smaller than 15
⚙ Integer rule: any integer is treated as True except 0, which is treated as False
Example: a = 7 and b = 0, so if (a): prints true
⚙ String rule: a String with a value is treated as True and an empty string is treated as False
Example: a = "Hello" and b = "", so if (a): prints true
EASIER: zero and the empty string count as False, everything else counts as True

4. The ELIF statement
★ ELIF: used to check additional conditions if the first condition (usually the IF statement) is evaluated as False
Example: a = 5, b = 5, if b > a is False so elif a == b runs and prints a and b are equal
⚙ When adding multiple conditions, use ELIF instead of multiple IF statements
Reason: ELIF statements do not execute if the IF statement is already found to be True
Multiple IF statements can be used instead of ELIF, but this is generally not recommended
EASIER: IF and ELIF form one chain, so once one branch is True the rest are skipped

5. The ELSE statement
★ ELSE: the statement used if none of the previous conditions are met
ELSE syntax: if condition: body, then else: body
⚙ ELSE executes its body only if all preceding conditional statements evaluate to False, otherwise it is not executed
ELSE is usually the last statement after IF and ELIF
Example: if True: print("It is true!") else: print("This won't get printed.") prints It is true!
Example: if False: print("This won't get printed.") else: print("It is false!") prints It is false!

6. Nested IF-ELSE statements
★ Nested IF-ELSE: an IF statement or ELIF statement present inside another IF or ELIF block
Nested if-else can be used to check for multiple conditions before making a decision
⚙ Nested syntax: outer if condition1 contains an inner if condition2 with its own else, and the outer else follows
Inner if body runs when both condition1 and condition2 are true
Inner else body runs when condition1 is true and condition2 is false
Outer else body runs when condition1 is false
Example: num = 7, if (num != 0): then if (num > 0): prints Number is a positive integer
⚙ Even or odd check: get the remainder of num divided by 2 with the % operator, and a remainder of 0 means even
Spec: if num is greater than 0 check num % 2 == 0, print The number is positive and is even. when true, otherwise print The number is positive but odd.
Spec: if num is not greater than 0, print The number is not positive.
Worked example: num = 67, 67 > 0 is True, 67 % 2 is 1 (not 0), so the output is The number is positive but odd.
Nested conditionals are also used for validation and authentication when the program asks for user input
Case scenario: a simple login system asks for a username and password and uses nested if-else statements to authenticate the user and authorize access
⚙ Login logic: the outer if checks username == "admin", the inner if checks password == "admin1234password"
Correct username and correct password prints Login successful.
Correct username and wrong password prints Invalid password.
Wrong username prints Invalid username. (the outer else)

7. Review of conditional statements
Conditional statements rely on Boolean expressions (conditions) before a statement is executed or not
Conditionals can be chained together with the elif clause and end with an else clause
Conditionals can be nested to check for multiple conditions before creating a decision

8. Match case statements
★ Match case statement: a value-matching decision-control structure introduced in Python 3.10
It is similar to chained conditional statements, but it does not support the use of relational or logical operators
It is best used when an expression may evaluate to multiple known values
Advantage, conciseness: complex branching logic can be expressed in a concise and readable manner
Advantage, readability: pattern matching is more readable and self-explanatory because it closely resembles the problem domain
Advantage, safety: exhaustive pattern matching, ensuring that all possible cases are handled
⚙ Match syntax: the line match <expression>: then an indented case <value>: then the code on a further indented line
Example: code = "A" with case "A" printing Alpha, case "B" printing Bravo, case "C" printing Charlie gives the output Alpha
⚙ Or operator in a case: the pipe symbol | checks for more than one value match in one case
Example: numValue = 4 with case 1 | 3 | 5 | 7 | 9 printing odd and case 2 | 4 | 6 | 8 | 10 printing even gives 4 is an even number.
⚙ If guard: an additional if statement can be added to a case as an extra condition check, written case <value1> | <value2> if <condition>:
⚙ Default case: the underscore _ used as the last case (case _:) runs when there is no match
Example No Match: the A, B, C example with an added case _: printing Unknown Code
Discussion example: bank menu with A Withdraw with Card, B Withdraw with QR, C Deposit, D Check Balance, and bankBalance = 1000
case "A" | "B" if bankBalance > 0 prints You have withdrawn money.
case "C" prints You have successfully deposited your money.
case "D" prints Your current balance is followed by bankBalance
case _ prints Please input A, B, C, or D only.
Worked example: input B with balance 1000 prints You have withdrawn money., input X prints Please input A, B, C, or D only.
</script>

<script type="text/plain" id="notes-cc7-L1">
Lecture 1 Introduction to Human Computer Interaction
Week 1 Unit 1, CC7 Human-Computer Interaction: what HCI is, its history, why it matters, and its four components

WHAT IS HCI
★ HCI (Human Computer Interaction) is a multidisciplinary field of study on the design of computer technology and the interaction between humans and computers.
HCI is concerned with the physical, psychological, and theoretical aspects of these processes.
HCI has since expanded to cover almost all forms of information technology design.
★ Second definition: HCI is the field of study that focuses on optimizing how users and computers interact by designing interactive computer interfaces that satisfy users' needs.
★ Misconception: HCI only involves physical interactions with a computer.
Fact: HCI encompasses all interactions between humans and digital devices.
EASIER: HCI is not just typing and clicking, it covers every way people deal with digital devices.

HISTORY OF HCI
HCI emerged in the 1980s, when personal computing was on the rise and desktop computers started appearing in households and corporate offices.
HCI's journey began with video games, word processors, and numerical units.
With the advent of the internet and the explosion of mobile and diversified technologies such as voice-based and Internet of Things (IoT), computing became omnipresent and omnipotent.
Technological competence further led to the evolution of user interactions.
Consequently, the need for a tool that would make man-machine interactions more human-like grew significantly.
This established HCI as a technology, bringing cognitive engineering, linguistics, neuroscience, and other fields under its realm.
Today HCI focuses on designing, implementing, and evaluating interactive interfaces that enhance user experience using computing devices.
Today HCI includes user interface design, user-centered design, and user experience design.
EASIER: Early desktops and games, then internet, mobile, voice and IoT everywhere, then a push for human-like interaction, now designing and evaluating interfaces for good user experience.

INTERACTION MODES DIAGRAM FROM SPICEWORKS
★ Cognitive Interaction is the top of the diagram and branches into five modes: Sight, Touch, Hearing, Voice, Spatial.
The diagram links Sight to a table called Interaction I and Spatial to a table called Interaction II.
Interaction I input (row labeled I/O): Mouse plus Keyboard, and Touch screen UI.
Interaction I output (row labeled O/P): Monitor plus speakers, and Screen plus speakers plus vibrations.
Interaction II input (row labeled I/O): Voice, Body movement, and Gesture plus face.
Interaction II output (row labeled O/P): Speakers, Sensors, and Screen plus speakers.
Columns line up as drawn: Voice with Speakers, Body movement with Sensors, Gesture plus face with Screen plus speakers.
EASIER: Interaction I is the classic keyboard, mouse and touchscreen style; Interaction II is the voice, body movement and gesture style.

EXAMPLES OF TECHNOLOGIES
The slides show smartphones (Android and iPhone), smartwatches, smart glasses, and social media apps.
Social media apps shown: Facebook, Instagram, Snapchat, YouTube, TikTok, LinkedIn, Pinterest, Twitter.
Warm-up questions: How do you interact with technology? What are some examples of technology you use regularly?

TECHNOLOGIES GOOD VS BAD
Question: Is good or bad the right question?
Question: What makes a technology good or bad?
Question: How can we build good technologies?
Question: How can we verify or validate the goodness of our technologies?

WHY HCI
Errors and mistakes in computer technologies still exist today.
Error cause: focus on whether or not the technology works.
Error cause: the concept is too cool or groundbreaking.
Error cause: functions are hard to utilize or process.
Error cause: specific people use things specifically.
Error cause: too much safety or security in the technology.
Error cause: too much focus on the design.
⚙ When creating technologies, it must be: suitable for the task; easy to use; adaptable to the user's knowledge and experience; provides feedback on the performance; displays information in a format and pace understandable to the user; conforms to the principles of software ergonomics.
The idea of use is also necessary for HCI.
★ Useful means accomplish what is required, for example play music, cook dinner, or format a document.
★ Usable means do it easily and naturally, without danger of error.
★ Used means make people want to use it: be attractive, engaging, fun.
EASIER: Useful does the job, Usable is easy and safe, Used is something people actually want to use.

FOUR COMPONENTS OF HCI
★ The four components of HCI are Human, Computer, Interaction, and Context.
⚙ Each component answers a question: Human is who the HCI is for, Computer is where the HCI is found, Interaction is what the HCI is, Context is how the HCI will be formed.
EASIER: Human = who, Computer = where, Interaction = what, Context = how.

THE HUMAN
★ The Human is also known as the user or end-user.
Humans are limited in their capacity to process information, which has important implications for design.
The Human component focuses on who the HCI is for.
Information is received and responses given via several input and output channels: Visual, Auditory, Haptic channel, and Movement.
★ Information is stored in memory of three types: Sensory memory, Short-term (working) memory, and Long-term memory.
Information is processed and applied through reasoning, problem solving, skill acquisition, and error.
Emotion influences human capabilities.
Users share common capabilities but are individuals with differences.

THE COMPUTER
★ The Computer component focuses on where the HCI is found.
The Computer comprises various elements, each of which affects the user of the system.
Computer elements: input devices, output display, virtual reality systems, various displays (physical controls, haptic dieback [sic], sensors), paper output and input, memory, and processing.

THE INTERACTION
★ Interaction models help us understand what is going on in the interaction between user and system.
Interaction models address the translations between what the user wants and what the system does.
The Interaction component focuses on what the HCI is.
★ Ergonomics are the physical characteristics of the interaction and how these influence its effectiveness.
Dialog between user and system is influenced by the style of the interface.
Interaction takes place within a social and organizational context that affects both user and system.

THE CONTEXT
★ Context is also known as paradigms.
Paradigms are examples of effective strategies for building interactive systems, used to design usable interactive systems.
The Context component focuses on how the HCI will be formed.
Context ranges from the introduction of timesharing computers, through the WIMP and web, to ubiquitous and context-aware computing.
EASIER: Paradigms move from timesharing, to WIMP and web, to ubiquitous and context-aware computing.

PRACTICE ACTIVITY
The Practice Activity is found in the Canvas Module.
The activity is done in groups of 4 members each, and the groupings were already randomly selected.

Lecture 02 Introduction to Designing
Failures in design, the Norman door, and the six principles of interaction design

LECTURE OBJECTIVES
Objective 1: Review fail designing
Objective 2: Principles in interaction design, covering Donald A. Norman and the Norman door, and the six principles in interaction design
The slide deck was prepared by Luis Meing

FAILURES IN DESIGN
★ HCI is a complex problem solving process that looks into creating and designing interactive products and services.
There is a lot of focus on how the users will interact with the product or service.
HCI looks into ideas like planned usage, target area, resources, cost, and viability.
The lecture shows ten real world design fails as pictures only, with no written explanation on the slides.
Fail 1: toilet stalls whose doors leave a large gap, so the toilets are exposed (a privacy problem).
Fail 2: a store window sale sign whose letter panels read SASA LELE across the rows instead of SALE, with SALE 50% banners below.
Fail 3: a pair of glass doors with pull style handles that are labeled PUSH.
Fail 4: a jeepney sign reading MINIMUM FEAR P11.00 (a typo for fare).
Fail 5: a bread package labeled English French Toast with a Spanish flag, the word American, a pizza picture, and German style text; the caption jokes about offending many countries at once.
Fail 6: a meme about building an orphanage's website without a Home page.
Fail 7: a zoo style sign with a hippo silhouette icon and the label Hipopótamos, shown with two outline redrawings of the icon.
Fail 8: food tray labels reading Chicken Adobo 45 and Adobong Manok P45 (the same dish named in two languages).
Fail 9: a framed sign reading Life is short lick the bowl placed on a toilet tank, with a caption where Mom says to leave the sign in the kitchen where it belongs.
Fail 10: a shirt printed with THINGER STRANGS, a misspelled imitation of the Stranger Things logo.

DONALD NORMAN AND THE NORMAN DOOR
★ Donald A. Norman is a cognitive psychologist, author, and lecturer.
★ Norman is dubbed the Father of User Experience Design because of his contributions to interaction design and user interface and user experience (UI/UX).
★ Norman door: basically any door that is confusing or difficult to use.
⚙ Test for a Norman door: determine whether or not the door makes sense as it is being approached.
EASIER: If you cannot tell how to use a door just by walking up to it, it is a Norman door.
The slides illustrate this with a glass door that has several long handles, and a picture of one hand pushing a flat panel while another hand pulls a handle.
★ As the solution to the Norman door, Norman formulated six principles of interaction design based on the concept of Human Centered Design.

THE SIX PRINCIPLES OF INTERACTION DESIGN
⚙ The six principles are Affordances, Signifiers, Constraints, Mappings, Feedback, and Conceptual Models.
Discoverability is a later addition and is not one of the original six.

AFFORDANCES
★ Affordances: in this context, to afford means to give a clue.
★ Affordances focus on the qualities or properties of an object that define its possible uses or make clear how it can or should be used.
Examples shown: a red mug with a handle and a computer mouse with a scroll wheel.
EASIER: An affordance is what the object itself hints that you can do with it.

SIGNIFIERS
★ Signifiers are indicators of any type that communicate the action needed so the affordance can take place.
A signifier can be any visual mark, sound, or perceivable indicator that communicates appropriate behavior to a person, such as a cursor for most digital user interfaces.
Examples shown: a text field with a cursor in a form with Title, Price, Location (optional), and Description fields, and enabled versus disabled (greyed out) buttons.
EASIER: The affordance is what can be done, and the signifier is the signal that shows how to do it.

CONSTRAINTS
★ Constraints are limitations or restrictions that give clues that allow us to determine a course of action by limiting the possible actions available to the user.
Constraints limit the set of possible actions that can be done.
⚙ There are four kinds of constraints: Physical, Cultural, Semantic, and Logical.
★ Physical constraint: shown with a lock cylinder and key.
★ Cultural constraint: shown with chopsticks, a fork and spoon, a fork spoon and knife set, and a chopsticks and spoon set.
★ Semantic constraint: shown with a car windshield carrying a sticker (the slide gives no further explanation).
★ Logical constraint: shown with a shape sorter cube toy with colored blocks.

MAPPINGS
★ Mappings look into the relationship between a set of inputs and a set of permissible outputs.
⚙ The relationship between controls and their actions follows the principles of good mapping, enhanced as much as possible through spatial layout and temporal contiguity.
Example shown: a New Customer phone form with a numeric keypad (digits with letters such as ABC and DEF).

FEEDBACK
★ Feedback happens when an object or system notifies the user that it is working towards the completion of its objective.
Feedbacks communicate the results of an action.
Example shown: a Loading... Please Wait screen with a progress bar.

CONCEPTUAL MODELS
★ A conceptual model is an explanation, usually highly simplified, of how something works.
There are often multiple conceptual models of a product or device, especially complex systems.
Example shown: a labeled scissors diagram with inner blade, cutting edge, back, blade, point or tip, screw, pivot point, handle, finger rest, stopper or silencer, and finger ring.

DISCOVERABILITY
★ Discoverability, also known as visibility, looks into the degree of ease with which the user can find all the elements and features of a new system when they first encounter it.
Discoverability was not part of the original six principles but was added in later years due to its relevance.
Example shown: a TV remote labeled 43 baffling buttons.

<script type="text/plain" id="notes-cc7-L3">
Lecture 3 The Human Being
Human capabilities and limitations: perception, memory and thinking (after Dix, Finlay, Abowd and Beale, 2005)

HCI STARTS WITH THE HUMAN
★ User: the central character in human-computer interaction (HCI).
We need to understand human capabilities.
We need to understand human limitations.
Human beings are complex.
The human is modelled as an information processor: input-output channels are the first part and memory is the second part.

INPUT-OUTPUT CHANNELS AND THE PERCEPTUAL SYSTEM
★ Perceptual system: sight, hearing, touch, taste and smell.
HCI is concerned with three of the five senses; taste and smell are not currently significant, which leaves sight, hearing and touch.
EASIER: for interface design, only the eyes, ears and skin matter right now.

SIGHT
★ Visual processing: transformation and interpretation of a complete image.
Expectations affect the way an image is perceived.
Visual processing compensates for movement, colour and brightness.
Visual processing helps resolve ambiguities.
★ Familiarity: a third cue for perceiving size (shown with an optical illusion picture).
★ Depth perception: another visual cue (shown with a landscape photograph).
Colour perception is another visual capability (introduced with pictures).

READING
★ Reading: perception and processing of text is a special case of visual perception.
⚙ Reading stage 1: the visual pattern of the word is perceived.
⚙ Reading stage 2: the word is decoded with an internal representation of the language.
⚙ Reading stage 3: syntactic and semantic analysis.
Adults read about 250 words per minute.
★ Word shape: words are recognised by their shape.
⚙ Rule: removing word-shape clues by using all caps is detrimental to reading speed and accuracy, so avoid all caps for text.
Meaning depends on context: Il can be the letters IL (as in Ilocano) or the roman number 2 (as in I, II, III, IV, V).
EASIER: the same shape is read differently depending on what surrounds it.
Example sentence shown: The quick brown fox jumps over the the lazy dog, with a repeated word across a line break.
★ Whole-word reading: text with scrambled middle letters (first and last letter in place) can still be read because we do not read every letter by itself but the word as a whole.

HEARING
★ Hearing: humans can hear sounds from 20 Hz to 15 kHz.
Humans can distinguish frequency changes of less than 1.5 Hz at low frequencies.
Hearing is less accurate at high frequencies.
Hearing can be selective.
Sound can convey a lot of information.

TOUCH
★ Haptic perception: an important means of feedback.
If we can see an object but not feel it, speed and accuracy of response are reduced.

HUMAN MEMORY
Memory is the second part of the model of the human as an information processor.
★ Three types of memory: sensory buffers, short-term memory and long-term memory.
★ Multistage model: sensory registers feed the short-term store, then short-term memory, then long-term memory, with executive control processes overseeing; data is lost from the system.
Timing: the short-term store lasts 0.5 to 2.0 seconds.
Timing: short-term memory lasts about 20 seconds.

SENSORY MEMORY
★ Iconic memory: visual; persistence of the image after the stimulus has been removed.
★ Echoic memory: aural; allows a brief play-back.
★ Haptic memory: touch.
Demonstration: an image (a chocolate cake) is flashed and removed, then viewers are asked what it was.
Pictures of a pillow and a cactus illustrate haptic memory.

SHORT-TERM MEMORY
★ Short-term memory: a scratch-pad for temporary recall, used for information needed fleetingly; rapid access, limited capacity.
⚙ Capacity: 7 +/- 2 chunks of information.
Patterns are useful memory aids.
EASIER: group items into meaningful chunks so more fits into the 7 +/- 2 slots.
Demonstration: memorise a picture for 10 seconds, write down everything remembered, then count how many you got.

LONG-TERM MEMORY
★ Long-term memory: stores everything we know: factual information, experiential knowledge and procedural rules of behaviour.
Capacity is huge, if not unlimited.
Access time is relatively slow (1/10 second).
Forgetting occurs more slowly.
Long-term memory has two parts: episodic and semantic.
Information can be organised into semantic networks, frames, scripts and production rules.
★ Episodic memory: memory of events in serial form; we can reconstruct actual events based on experience.
★ Semantic memory: structured record of facts, concepts and skills; derived from episodic memory.
EASIER: episodic is what happened to me, semantic is what I know.
Semantic memory prompts used: the national hero of the Philippines, the numeric value of pi, the colours of the rainbow.
★ Semantic networks: interconnections or associations among memories (for example, what you associate with the word cat).
★ Frames: contain slots or attributes; attributes represent default, fixed or variable information.
Frame example for Dog: fixed legs 4, default sound bark, variable size and colour.
EASIER: a frame is a form with some boxes pre-filled, some holding a usual answer, and some left open.
★ Scripts: represent default stereotypical information.
⚙ Script components: entry conditions, results, props, roles, scenes and tracks.
Script example: goal is to fill my mug with coffee; entry condition is that my mug is empty; result is that my mug is full of coffee.
Script example continued: props are mug, coffee machine and coffee; role is me making my coffee and filling my cup.
Script example continued: scenes are first preparing the coffee and then drinking it when ready; the track is no more coffee available.
★ Production rules: a series of condition-action (if-then) statements.
Production rule example: if it is raining then bring an umbrella.

LONG-TERM MEMORY PROCESSES
Long-term memory processes are storing, forgetting and remembering.
⚙ Total time hypothesis: the amount learned is proportional to the amount of time spent.
⚙ Distribution of practice effect: learning time is most effective if distributed over time.
EASIER: total time says more hours means more learning; distribution says spread those hours out.
⚙ Information must be meaningful for it to be stored.
Demonstration: an abstract word list (faith, age, cold, tenet, quiet, logic, idea, value, past, large) and a concrete word list (boat, tree, cat, child, rug, man, church, gun, flame, head) are each shown for 10 seconds.
⚙ Result: it is easier to remember concrete words than abstract words, so the second list is usually recalled better.
Forgetting has two causes: decay and interference.
★ Interference: old memory replaced by new or vice versa.
★ Retroactive interference: new information replaces the old.
★ Proactive inhibition: the old memory interferes with the new information.
EASIER: retroactive means the new thing pushes the old one out; proactive means the old thing blocks the new one.
Remembering (information retrieval) takes two forms.
★ Recall: information is reproduced from memory.
★ Recognition: the information has been seen before.
EASIER: recall is writing the answer from a blank page; recognition is spotting the right answer in a list.

THINKING
Thinking covers reasoning and problem solving.
★ Reasoning: the process of deriving new information from what is known.
★ Deductive reasoning: two or more assertions lead to a conclusion, with mathematical certainty.
Deductive example: all blondes are fun; Christy is a blonde; therefore Christy is fun.
★ Inductive reasoning: arriving at generalisations from observations we have seen about cases we have not seen.
Inductive example: every elephant we have seen has a trunk; therefore all elephants have trunks.
★ Abductive reasoning: formulation of hypotheses to explain a phenomenon.
EASIER: deduction proves, induction generalises, abduction proposes an explanation.

PROBLEM SOLVING
★ Problem solving: the process of finding a solution to an unfamiliar situation.
Three examples are covered: Gestalt, problem space theory and analogy in problem solving.
★ Gestalt: German for whole or form; people draw on previous experience, have insights, are sense-makers and restructure the problem.
Gestalt weakness: the theory lacked structure and support and does not explain insight and restructuring.
Gestalt principle: the whole is greater than the sum of its parts.
Gestalt principle: people perform based on understanding the general principles of a situation.
Gestalt warning: if we perform on memorised facts, we make stupid mistakes.
★ Problem space theory: the problem is represented in terms of problem states, and heuristics are employed to go from the initial state to the goal state.
Problem space theory limit: the general problem solver works for well-structured domains, but real-world problems are more complex.
★ Analogy in problem solving: interested in how people solve novel problems; similarities between a known domain and the new one are noted, and operators from the known domain are transferred.
★ Skill acquisition: the ability to remember larger and larger chunks, for example chess players.
Novices group problems according to superficial characteristics.
Experts group problems according to conceptual similarities.

NEXT TIME
Next lecture topics: errors and emotions.
</script>

<!-- ===== CC7 LECTURE 4 ===== -->
<script type="text/plain" id="notes-cc7-L4">
Lecture 4 Human Errors
From Norman, D.A. (1988). The Design of Everyday Things

1. Human vs computer
★ Humans are the result of millions of years of evolution
Humans: the guiding principle was survival, not precision
Humans: robust in the face of unexpected circumstances
Humans: have the ability to deceive
★ Computers are less than 100 years old
Computers are reliable, consistent, and based on mathematics
EASIER: People were built to survive surprises, computers were built to be exact.

2. Differences in computation
★ Human computation is slow, complex, highly parallel, subject to rapid change, error tolerant, and forgiving
★ Computer computation is fast, high speed, precise, and not fault tolerant
EASIER: People are sloppy but flexible, machines are exact but brittle.

3. The concept of error
★ Common computer view of error: the computer was given information it could not process
Blame is then shifted onto the human being
⚙ Achieving a goal should be a cooperative endeavor between human and machine
⚙ The task is not to assess blame but to complete the task
EASIER: Stop asking who is at fault and help get the job done.

4. Types of error
★ Slips result from automatic behavior
★ Mistakes stem from conscious deliberation
EASIER: A slip is autopilot going wrong, a mistake is thinking it through and getting it wrong.
Six types of slips: capture, description, data driven, association activation, loss of activation, and mode errors

5. Capture errors
★ Capture error: a frequently done activity captures the one intended
Example: mistakenly dialing telephone numbers with the same prefix
Example: 426-6001 is the Ateneo trunk line and 426-6071 is the DISCS direct line
EASIER: A habit grabs the steering wheel from the thing you meant to do.

6. Description errors
★ Description error: an action is performed on the wrong artifact
EASIER: Right action, wrong object.

7. Data-driven errors
★ Data-driven error: triggered by the arrival of sensory data
Example: typing what you are thinking, hearing, or seeing and not what is intended
Example: calling someone by the wrong name
Slide-note anecdote under this topic: a thief shouted a stick-up at a bank and the 20-year-old teller told him he was in the wrong line and to wait over there, and he waited until the police arrived
EASIER: What comes in through your senses leaks into what you do.

8. Freudian slips
★ Freudian slip: a verbal or memory mistake that usually reveals the subconscious

9. Loss-of-activation errors
★ Loss-of-activation error: forgetting to do something
EASIER: The intention faded before you carried it out.

10. Association activation errors
Association activation errors are listed as a slip type, but the slides give no definition or example for them

11. Mode errors
★ Mode error: an action sequence performed in the wrong mode
Example: typing in the password with CAPS LOCK on
Slide-note anecdote near this topic: a government secretary mistakenly sent a personal letter to all government offices
EASIER: Right keystrokes, wrong state of the system.

12. Mistakes
★ Mistake: choice of an inappropriate goal
Mistakes include a poor decision, misclassifying a situation, or failing to take all factors into account
Mental thought is not neat and orderly
The disorder leads to creativity, discovery, and great robustness of behavior

13. Failure to detect problems
★ The user's ability to detect errors is unreliable
★ Relevance bias: people seek confirmatory evidence when evaluating a hypothesis
★ Partial explanation: crude agreement between what the user expects and what he sees
★ Overlap of model and world: the user's mental model is partially consistent with the world
EASIER: Users look for proof they are right, accept a rough match, and rely on a model that is only partly true.
</script>

{"q":"Which description fits human computation as contrasted with computer computation?","options":["Slow, complex, highly parallel, error tolerant","Fast, precise, complex, and strictly serial in operation","Slow, simple, serial, and unforgiving of any error","Fast, highly parallel, and not at all fault tolerant"],"answer":0,"explanation":"Human computation is slow, complex, highly parallel, error tolerant, and forgiving. The other options attach computer traits (fast, precise, not fault tolerant) to humans.","source":"notes"},
{"q":"When a computer is given information it cannot process, whom does the conventional view blame?","options":["The programmer who wrote the software","The human user","The manufacturer of the hardware","No one, because errors are treated as neutral events"],"answer":1,"explanation":"The computer received information it could not process, and blame is shifted onto the human being. The lecture presents this as the wrong framing.","source":"notes"},
{"q":"An application answers every unparseable input with the message 'User error: fix your input.' Which principle does this design violate?","options":["Reaching a goal is a cooperative effort, not an exercise in blame","Users should be treated as precise, consistent components of the machine","Errors should be penalized so that users avoid repeating them","Computers should sacrifice speed in order to remain fault tolerant"],"answer":0,"explanation":"Achieving a goal should be a cooperative endeavor between human and machine. Pinning the fault on the user shifts blame instead of helping complete the task.","source":"notes"},
{"q":"What is the origin of a slip?","options":["Automatic behavior","Conscious deliberation about the goal","Choice of an inappropriate goal","Misclassifying the situation"],"answer":0,"explanation":"Slips result from automatic behavior. Conscious deliberation, poor goals, and misclassification are the sources of mistakes.","source":"notes"},
{"q":"After careful deliberation, a driver concludes the lane ahead is closed and detours, but the lane was actually open. How is this error classified?","options":["A slip, because the result was not the outcome the driver wanted","A mistake, because it stems from conscious deliberation","A slip, because a step in the sequence was forgotten","Neither, since no harm resulted from the detour"],"answer":1,"explanation":"Mistakes stem from conscious deliberation, here a poor decision based on a misjudged situation. An unwanted outcome alone does not make something a slip; slips come from automatic behavior.","source":"notes"},
{"q":"Which of these is NOT one of the six types of slips?","options":["Mode errors","Capture errors","Loss of activation errors","Relevance bias"],"answer":3,"explanation":"The six slip types are capture, description, data driven, association activation, loss of activation, and mode errors. Relevance bias is a factor in failing to detect problems.","source":"notes"},
{"q":"In a capture error, what takes over the intended action?","options":["A sudden sensory stimulus in the environment","An unconscious wish that surfaces in speech","An operating mode set earlier","A frequently performed activity"],"answer":3,"explanation":"A frequently done activity captures the one intended. Sensory triggers describe data-driven errors, unconscious wishes describe Freudian slips, and modes describe mode errors.","source":"notes"},
{"q":"A caller means to dial the DISCS direct line (426-6071) but dials the Ateneo trunk line (426-6001), which shares the same prefix. Which slip is this?","options":["Description error","Data-driven error","Capture error","Mode error"],"answer":2,"explanation":"Dialing a number with the same prefix as the intended one is the lecture's example of a capture error, where the frequently done activity takes over.","source":"notes"},
{"q":"Which statement defines a description error?","options":["Performing the right action on the right object in the wrong mode","Forgetting to carry out an intended action","Performing a habitual action in place of the intended one","Performing an action on the wrong artifact"],"answer":3,"explanation":"A description error is an action performed on the wrong artifact. The other options describe mode, loss-of-activation, and capture errors.","source":"notes"},
{"q":"You intend to pour milk into your coffee but pour it into the identical-looking mug of tea beside it. Which slip is this?","options":["Capture error","Description error","Loss-of-activation error","Mode error"],"answer":1,"explanation":"The action was right but was performed on the wrong artifact, which is a description error.","source":"notes"},
{"q":"Data-driven errors are triggered by:","options":["The arrival of sensory data","A habitual activity overriding the intended one","A poor choice of goal","An action sequence started in the wrong mode"],"answer":0,"explanation":"Data-driven errors are triggered by the arrival of sensory data. A habitual activity is capture, a poor goal is a mistake, and the wrong mode is a mode error.","source":"notes"},
{"q":"A Freudian slip is:","options":["A habitual, frequently done activity that overrides the action that was intended","A failure to notice that a problem exists because of confirmatory evidence","An action sequence that is carried out while the system is in the wrong mode","A verbal or memory mistake that usually reveals the subconscious"],"answer":3,"explanation":"A Freudian slip is a verbal or memory mistake that usually reveals the subconscious. The others describe capture errors, relevance bias, and mode errors.","source":"notes"},
{"q":"Loss-of-activation errors are errors of:","options":["Acting on the wrong artifact","Acting in the wrong mode","Choosing an inappropriate goal","Forgetting to do something"],"answer":3,"explanation":"A loss-of-activation error is forgetting to do something. Wrong artifact is description, wrong mode is mode error, and inappropriate goals are mistakes.","source":"notes"},
{"q":"Mode errors are:","options":["Action sequences performed in the wrong mode","Actions performed on the wrong artifact","Errors triggered by the arrival of sensory data","Failures to carry out an intended action"],"answer":0,"explanation":"A mode error is an action sequence performed in the wrong mode. The other options are description, data-driven, and loss-of-activation errors.","source":"notes"},
{"q":"A user types the correct password but is rejected because CAPS LOCK is on. Which slip is this?","options":["Description error","Capture error","Mode error","Loss-of-activation error"],"answer":2,"explanation":"The right keystrokes were performed while the keyboard was in the wrong mode, the lecture's example of a mode error.","source":"notes"},
{"q":"Which describes a mistake as opposed to a slip?","options":["Typing words you have just heard instead of the words you meant to type","Forgetting to carry out a step that was part of the intended plan","Choosing an inappropriate goal or making a poor decision","Dialing a number that shares its prefix with the number that was intended"],"answer":2,"explanation":"Mistakes involve choosing an inappropriate goal or a poor decision. The other options are data-driven, loss-of-activation, and capture slips.","source":"notes"},
{"q":"An operator misreads a panel, decides the plant is in a normal state when it is in a fault condition, and proceeds accordingly. Which classification fits?","options":["Mistake, because the situation was misclassified","Capture error, because the operator repeated a habitual action","Loss-of-activation error, because a step was forgotten","Mode error, because the panel was in the wrong mode"],"answer":0,"explanation":"Misclassifying a situation leads to a poor decision, which is a mistake. No habit, forgotten step, or wrong-mode action is described.","source":"notes"},
{"q":"Human mental thought is not neat and orderly. What does the lecture say follows from this disorder?","options":["It is a pure flaw that training should eliminate","It makes humans less robust in behavior than computers","It leads to creativity, discovery, and robust behavior","It makes errors impossible for users to detect"],"answer":2,"explanation":"The same disorder behind human error also leads to creativity, discovery, and great robustness of behavior.","source":"notes"},
{"q":"Which statement about a user's ability to detect errors is supported?","options":["It is highly reliable once the user is trained","It is unreliable","It is reliable for slips but unreliable for mistakes","It is reliable whenever the computer reports the error"],"answer":1,"explanation":"The user's ability to detect errors is unreliable. Relevance bias, partial explanation, and model-world overlap are given as reasons.","source":"notes"},
{"q":"Relevance bias means:","options":["People accept a crude agreement between what they expect and what they see","People look for confirming evidence when testing a hypothesis","A person's mental model is only partly consistent with the world","People attend most to the latest sensory data they receive"],"answer":1,"explanation":"Relevance bias is seeking confirmatory evidence when evaluating a hypothesis. The other options describe partial explanation, overlap of model and world, and a made-up factor.","source":"notes"},
{"q":"Partial explanation refers to:","options":["A mental model that is only partly consistent with the world around","A crude agreement between what is expected and what is seen","Seeking only evidence that confirms a hypothesis","An error message that explains only part of a failure"],"answer":1,"explanation":"Partial explanation is a crude agreement between what the user expects and what he sees. A mental model that is only partly consistent with the world is overlap of model and world, and seeking only confirming evidence is relevance bias.","source":"notes"},
{"q":"Overlap of model and world means:","options":["The user searches only for evidence confirming a hypothesis","The user's expectation roughly agrees with what is seen","The mental model is partly consistent with the world","The computer's model is identical to the user's model"],"answer":2,"explanation":"Overlap of model and world is a mental model that is partially consistent with the world. Seeking confirmatory evidence is relevance bias, and a crude agreement between expectation and observation is partial explanation.","source":"notes"},
{"q":"Which pairing of factor and description is correct?","options":["Overlap of model and world: a partly consistent mental model","Relevance bias: crude agreement between expectation and observation","Partial explanation: seeking confirmatory evidence for a hypothesis","Overlap of model and world: dialing a number with a shared prefix"],"answer":0,"explanation":"Overlap of model and world is a partly consistent mental model. The pairings that give relevance bias the description of partial explanation, or partial explanation the description of relevance bias, are swapped, and a shared-prefix dialing error describes a capture error.","source":"notes"},
{"q":"The lecture's treatment of errors is drawn from which work?","options":["Nielsen (1993), Usability Engineering","Shneiderman (1987), Designing the User Interface","Card, Moran, and Newell (1983), The Psychology of Human-Computer Interaction","Norman (1988), The Design of Everyday Things"],"answer":3,"explanation":"The material is attributed to Norman, D.A. (1988), The Design of Everyday Things.","source":"notes"},
{"q":"Which statement about human and computer computation is NOT true?","options":["Human computation is error tolerant and forgiving","Computer computation is precise and not fault tolerant","Human computation is subject to rapid change","Computer computation is slow, complex, and highly parallel"],"answer":3,"explanation":"Computer computation is fast, high speed, precise, and not fault tolerant. Slow, complex, highly parallel processing describes humans, so the first statement is the false one.","source":"notes"},
{"q":"Which pairing of slip type and description is mismatched?","options":["Capture error: a frequently done activity captures the one intended","Description error: triggered by the arrival of sensory data","Mode error: an action sequence performed in the wrong mode","Loss-of-activation error: forgetting to do something"],"answer":1,"explanation":"A description error is an action performed on the wrong artifact. Being triggered by the arrival of sensory data defines a data-driven error. The other three pairings are correct.","source":"notes"},
{"q":"Which statement about failure to detect problems is NOT true?","options":["Overlap of model and world means the user's mental model is fully consistent with the world","The user's ability to detect errors is unreliable","Relevance bias leads people to seek confirmatory evidence when evaluating a hypothesis","Partial explanation is a crude agreement between what the user expects and what he sees"],"answer":0,"explanation":"Overlap of model and world means the mental model is only partially consistent with the world, not fully consistent. The other three statements are accurate.","source":"notes"}
]
</script>

Lecture 5 The Human: Emotions
CC7 Human Computer Interaction: why emotions matter, their effects on design, and the three levels of processing

1. Why emotions matter
★ Emotions make the human smart.
★ Much of human behavior is subconscious.
★ The affective system helps a person make judgments.
★ People without emotions cannot choose between alternatives.
EASIER: Emotion is what tips a decision. Without it, a person cannot pick one option over another.

2. Effects of using emotions in design
★ Using emotions in design broadens thorough processes.
★ Using emotions in design brings greater creativity.
★ Using emotions in design brings greater imagination.
★ Using emotions in design makes people more tolerant of minor difficulties.
EASIER: An emotionally engaged user thinks more widely, creates and imagines more, and forgives small flaws.

3. The three levels of emotion-based processing
★ Emotion-based processing has three levels: visceral, behavioral, and reflective.
EASIER: Visceral is the look, behavioral is the use, reflective is the self-image and memories.

4. Visceral level
★ Visceral processing is pre-conscious and pre-thought.
★ Appearance matters at the visceral level.
★ First impressions are formed at the visceral level.
★ The visceral level covers the initial impact of the product: touch, feel, and appearance.
Slide image: a kitten appears on the visceral slide, with no caption in the source.
EASIER: Visceral is the gut reaction that happens before you think.

5. Behavioral level
★ The behavioral level focuses on the use of the product.
★ Behavioral covers the experience with the product: function, performance, and usability.
Slide images: two chairs appear on the behavioral slide, with no caption in the source.
EASIER: Behavioral asks whether the product works well and is good to use.

6. Reflective level
★ The reflective level is affected by culture, experience, education, and individual differences.
★ The reflective level can override the visceral and behavioral levels.
★ The reflective level involves sophistication versus popularity.
★ The reflective level involves long-term relationships with the product.
★ The reflective level involves consideration of the future.
Slide images: two kinds of wristwatch appear on the reflective slide, with no caption in the source.
EASIER: Reflective is the thinking-it-over level, and it can overrule a gut reaction or a good use experience.

7. Working with the three levels
⚙ Visceral: design for appearance.
⚙ Behavioral: design for pleasure and effectiveness of use.
⚙ Reflective: design for self-image, personal satisfaction, and memories.
EASIER: Look for visceral, use for behavioral, and who I am and what I remember for reflective.
</script>

<!-- ===== CC7 LECTURE 6 ===== -->
<script type="text/plain" id="notes-cc7-L6">
Lecture 6 Interactions
CC7 Human Computer Interaction: terms, Abowd and Beale framework, Norman's cycle, controller-display mappings, mobile interaction

1. Definition and terms
★ Interaction: the purpose of interaction is to accomplish a goal within an application domain, that is, to perform what is intended with what is available.
★ Domain: an area of expertise, what you know and specialize in.
★ Goal: the desired output, what you planned on achieving.
★ Tasks: the operations performed to manipulate the domain, what you will do to reach your goal.
⚙ Tasks involve identifying human and computer specifications.
Human specifications: perceptual systems, memory and processing, plus human error and emotions.
Computer specifications: input and output devices, memory, and processing.
⚙ Tasks also involve determining an interaction framework: the Abowd and Beale framework or Norman's execution-evaluation cycle.
★ Task analysis: identifying the problem space for the user in terms of domain, goals, intentions, and tasks.
Task analysis uses the point of view of the user and judges what they might think.
★ System: the computer-based system, either the software or the hardware you will be designing.
★ Core language: the language of the computer-based system, meaning the programming language or languages you will use.
★ User: the individual who will be using the system.
★ Task language: the language of the user.
EASIER: core language belongs to the machine, task language belongs to the person.

2. Concept of interaction
★ Interaction in HCI takes place between the user and the system, and the point of contact is the interface.
⚙ The interface must translate the communication between the user and the system.
Translation can fail at several points.

3. Abowd and Beale framework
★ The Abowd and Beale framework identifies system and user components which communicate via the input and output components.
In the diagram, S is the system (core), U is the user (task), and input and output sit between them.
The framework shows where user input can come from and where results are displayed.
The user formulates a goal and a task to achieve that goal.
⚙ Cycle order: user to input by articulation, input to system by performance, system to output by presentation, output to user by observation.
EASIER: the loop runs user, input, system, output, back to user, with the verbs articulate, perform, present, observe.
★ Articulation: the user expresses the task in the input language.
Articulation requires the input language to be compatible with achieving the task.
Articulation means the user must communicate what they want in terms the system can understand as input.
★ Performance: the interface translates the input language into stimuli for the system, that is, from the input language to the system's core language.
⚙ Performance uses an interpreter or a compiler, depending on the programming language.
Performance covers what is displayed and allowed to happen and will be processed by the computer.
★ Presentation: the system presents the results in the output language, showing the result of what it processed.
★ Observation: the user translates the output language into personal understanding.
⚙ The result of the output must be something the user understands.

4. Abowd and Beale advantages
It is not restricted to electronic computer systems.
It identifies all major components involved in interaction.
It allows comparative assessment of systems.
It provides an abstraction of interaction.

5. Norman's execution-evaluation cycle
★ Norman's model (Norman's interaction cycle) is a theory on how to view HCIs, covering the interaction between user and system.
★ Execution: doing tasks to achieve the goal.
★ Evaluation: testing if tasks were executed properly, and taking note of what went wrong and what can be improved.
⚙ Execution steps: Step 1 user establishes a goal, Step 2 user formulates their intention, Step 3 user decides on action on the interface, Step 4 user executes the action.
⚙ Evaluation steps: Step 5 user perceives the system state, Step 6 user interprets the system response, Step 7 user evaluates the system with respect to the goal.
EASIER: steps 1 to 4 are doing, steps 5 to 7 are checking.
Advantage: it is a useful means of understanding the interaction clearly and intuitively.
Advantage: it allows more detailed work to be placed within a common framework.
Advantage: it considers the user's view.

6. Norman's cycle worked examples
Example 1 setup: you are reading at night, need more light, and are right beside an electric lamp.
Example 1, Step 1 goal: get more light for reading.
Example 1, Step 2 intention: switch on the lamp.
Example 1, Step 3 action on the interface: look for the lamp, reach over to it, press the light switch.
Example 1, Step 4: carry out the actions specified in Step 3.
Example 1, Step 5 perceive: look at the lamp, look around the room, ask whether the light is on.
Example 1, Step 6 interpret: is the light on or off, and if off, what could be wrong.
Example 1, Step 7 evaluate: have you achieved your goal.
Example 2 setup: you and classmate Marco are finishing a report the night before the presentation.
Example 2, Step 1 goal: get a status report on Marco's contribution, by phone call, instant messenger, email, or text.
Example 2, Step 2 intention: chat with Marco using Facebook Messenger, because the intention should include the technology to be used.
Example 2, Step 3 action: log in to Facebook, check Marco's status, click his name if he is online, then type the message.
Example 2, Step 3 tip: specify the actions as separate steps so they are easier to organize.
Example 2, Step 4: log in, check Marco's status, click his name, type the message.
Example 2, Step 5 perceive: was the password accepted, was a connection established, is Marco online or offline, was a message prompt given, how do I check what I typed, how do I know it was sent.
Example 2, Step 6 interpret: how do I know Marco is online, how do I know he read my message.
Example 2, Step 7 evaluate: ultimately, was I able to deliver the message.

7. Gulfs of execution and evaluation
★ Gulf of execution: the core and task languages differ, which is the difference between the user's formulation of the action to reach the goal and the actions allowed by the system.
EASIER: can I make the system do what I mean.
★ Gulf of evaluation: the distance between the physical presentation of the system state and the expectation of the user.
EASIER: can I tell what the system just did.

8. Assessing interactions
⚙ Frameworks are meant to be means of judging the overall usability of an interactive system.
All analysis is dependent on the current task.
It is only in attempting to perform a task that we can determine if our tools are adequate.

9. Controller-display relationships
★ Display: provides operators with information about the operational status of a system.
★ Control device: allows operators to take action to influence the state of the system.
★ Controller-display relationship: the relationship between what a user does and how the system responds, which should be natural, seamless, efficient, and intuitive.
Controller-display relationships are sometimes called mappings.
There are four types of mappings: spatial, gain and transfer functions, latency, and property sensing.

10. Types of mappings
★ Spatial mapping relies on spatial memory, the ability to learn the location of objects of interest by interacting with them repeatedly.
In using a computer, spatial memory lets users develop automaticity when accessing data.
This means the user can use their cognitive processes to quickly understand and use a device.
Example: a mouse moves a pointer, and moving the mouse to the right should move the pointer to the right.
★ Gain and transfer functions: the ratio between movement of the controller and movement of the display.
EASIER: how far the display moves for each bit of controller movement.
Example: more effort or an uneven pointer reaction to the amount of space you move the mouse shows a poor mapping.
The relationship between how you use the controller and how the display reacts can be nonlinear.
Gain settings let you adjust how much force, movement, or key pressing an action needs, and the sensitivity of your device's controllers.
Many devices now include features to tweak this sensitivity more easily.
★ Latency: the delay between an input action and the corresponding display or output, measured in milliseconds.
Latency is normally associated with internet connectivity but also occurs with input devices such as keyboards, mice, and wireless headphones.
Latency is usually caused by your network hardware, your server's location, and the internet routers between your server and your devices.
Satellite internet connections have high latency in almost every condition.
Servers located far from your network increase your chances of latency.
⚙ Typical audio latency on a regular wired connection is 5-10 milliseconds.
⚙ Bluetooth latency ranges from an ideal 30-60 milliseconds up to 100-300 milliseconds for true wireless earbuds and headphones.
★ Property sensing: sensing the force given by the user and transforming it into input for a device.
Property sensing differs from gain and transfer mapping, which adjusts how your devices interpret your inputs.
Property sensing focuses on how users adjust their own input to get different results from their device.
EASIER: gain tunes how the device reads you, property sensing is the device sensing what you physically do.
Property sensing includes adding new sensors to existing devices to detect human actions: touching, tapping, grasping, moving, pushing, flicking, and squeezing.
★ Property in this context means the actions sensed by the controller: position, displacement, and force.

11. Mobile technologies
Mobile technologies have introduced forms of interaction that were not previously available on desktops.
This has led to new applications and features that take advantage of these interactions.
★ Interaction technologies now common on mobile devices: touchscreens and multitouch, accelerometers, fingerprint scanners, face scanners, and gyroscopes.

<script type="application/json" id="quiz-cc7-L6">
[
{"q":"In HCI, what is the stated purpose of interaction?","options":["To make the interface as visually appealing as possible to users","To transfer data between hardware components at the highest possible speed","To translate the system's core language into the user's personal vocabulary","To accomplish a goal within an application domain"],"answer":3,"explanation":"Interaction exists to accomplish a goal within an application domain, performing what is intended with what is available. Visual appeal and raw data speed are side concerns, and translating languages is the interface's job, not the purpose of interaction.","source":"notes"},
{"q":"A student opens a spreadsheet, enters values, and applies a SUM formula in order to produce a budget total. Which labeling is correct?","options":["Budget total is the task; entering values and applying SUM are the goals","Budget total is the goal; entering values and applying SUM are tasks","Budget total is the domain; entering values is the core language","Budget total is the task language; SUM is the goal"],"answer":1,"explanation":"The goal is the desired output (the total). Tasks are the operations performed to reach it (entering values, applying SUM). Swapping goal and task is the common trap. The domain is the area of expertise, and the core language belongs to the system.","source":"notes"},
{"q":"Which description matches task analysis?","options":["Compiling the system's source code into machine-level instructions for the processor","Measuring the delay between an input action and the corresponding output on the display","Identifying the user's problem space: domain, goals, intentions, and tasks","Testing afterwards whether the user's tasks were executed properly and what went wrong"],"answer":2,"explanation":"Task analysis identifies the problem space for the user in terms of domain, goals, intentions, and tasks, from the user's point of view. Compiling is a performance concern, measuring delay is latency, and checking execution afterwards is the evaluation phase of Norman's cycle.","source":"notes"},
{"q":"A banking app is written in Java, but customers think in terms of 'transfer funds' and 'check balance'. Which pairing is correct?","options":["Java is the task language; 'transfer funds' is the core language","Java is the core language; 'transfer funds' is the task language","Both are core language, because both are part of the system itself","Both are task language, because both are used by the customer"],"answer":1,"explanation":"The core language is the language of the computer-based system (the programming language). The task language is the language of the user. Reversing them is wrong, and merging them into one language ignores the gap an interface must bridge.","source":"notes"},
{"q":"Which pairing of term and definition is correct?","options":["System: the individual using the application; User: the software or hardware being designed","System: the computer-based software or hardware; User: the individual who will use it","System: the language of the user; User: the language of the computer-based system","System: the area of expertise; User: the operations that manipulate the domain"],"answer":1,"explanation":"The system is the computer-based system (software or hardware being designed) and the user is the individual who will use it. Swapping them is wrong, and the other pairings describe task and core language or domain and tasks.","source":"notes"},
{"q":"Which set lists the human specifications to identify when analyzing tasks?","options":["Human perception, memory, processing, error, and emotions","Input and output devices, computer memory, and processing","Interpreters, compilers, and the programming languages of the core","Servers, routers, and network hardware between server and device"],"answer":0,"explanation":"Human specifications cover perceptual systems, memory and processing, and human error and emotions. Input/output devices and computer memory and processing are the computer specifications. The other two options are performance and latency topics.","source":"notes"},
{"q":"Interaction in HCI takes place between the user and the system. What must the interface do, and what is the risk?","options":["Store the user's goals; storage limits can cause the translation to fail","Replace the user's tasks; automation can cause the user to lose control","Display output only; ignoring input can cause the system to stall","Translate their communication; translation can fail at several points"],"answer":3,"explanation":"The interface must translate communication between user and system, and that translation can fail at several points, which is why frameworks such as Abowd and Beale and Norman's cycle exist. The other options invent roles the interface does not have.","source":"notes"},
{"q":"In the Abowd and Beale framework, which pairing of component and what it represents is correct?","options":["Core represents the user; task represents the system","Input represents the system; output represents the user","Core represents the system; task represents the user","Task represents the output; core represents the input"],"answer":2,"explanation":"In the diagram S is the system (core) and U is the user (task), with input and output between them. Swapping system and user is wrong, and the remaining pairings misassign input and output.","source":"notes"},
{"q":"Which sequence correctly traces the Abowd and Beale cycle starting from the user?","options":["Articulation, performance, presentation, observation","Observation, presentation, performance, articulation","Performance, articulation, observation, presentation","Articulation, presentation, performance, observation"],"answer":0,"explanation":"User to input is articulation, input to system is performance, system to output is presentation, and output to user is observation. Swapping performance and presentation would skip the system processing the input.","source":"notes"},
{"q":"Which statement best describes articulation in the Abowd and Beale framework?","options":["The interface translates the input language into stimuli for the core language","The user expresses the task in the input language","The system displays what it processed in the output language","The user translates the output language into personal understanding"],"answer":1,"explanation":"Articulation is the user expressing the task in the input language, which must be compatible with achieving the task. Translating input into stimuli for the core language is performance, displaying results is presentation, and the user's own understanding of output is observation.","source":"notes"},
{"q":"A user sees an error code that means nothing to them. Which Abowd and Beale step has failed, and why?","options":["Observation, because the output is not something the user understands","Articulation, because the user could not state the task in the input language","Performance, because the interpreter could not translate the input language","Presentation, because the system did not show any result of processing"],"answer":0,"explanation":"The system did present a result, but observation requires the output to be something the user understands. The code was shown (so presentation worked), and the problem is not about stating the task or translating input.","source":"notes"},
{"q":"Which of the following is NOT listed as an advantage of the Abowd and Beale framework?","options":["It models the user's seven stages of action","It is not restricted to electronic computer systems","It identifies all major components involved in interaction","It allows comparative assessment of systems"],"answer":0,"explanation":"The seven stages of action belong to Norman's execution-evaluation cycle. The Abowd and Beale advantages are: not restricted to electronic systems, identifies all major components, allows comparative assessment, and provides an abstraction of interaction.","source":"notes"},
{"q":"Norman's interaction cycle divides the interaction between user and system into which two phases?","options":["Execution and evaluation","Presentation and observation","Articulation and performance","Perception and memory"],"answer":0,"explanation":"Norman's cycle is the execution-evaluation cycle. Execution is doing tasks to achieve the goal, and evaluation is testing whether they were executed properly. Presentation, observation, articulation, and performance are Abowd and Beale terms.","source":"notes"},
{"q":"Which list gives the four execution steps of Norman's cycle in order?","options":["Perceive state, interpret response, evaluate against goal, establish goal","Formulate intention, establish goal, execute action, then decide on action","Decide on action, establish goal, perceive state, execute action","Establish goal, formulate intention, decide on action, execute action"],"answer":3,"explanation":"Execution runs: establish a goal, formulate the intention, decide on the action on the interface, execute the action. The option that mixes in evaluation steps is wrong, and the others scramble the order.","source":"notes"},
{"q":"Which of the following is an advantage listed for Norman's cycle, rather than for the Abowd and Beale framework?","options":["It is not restricted to electronic computer systems","It allows comparative assessment of systems","It identifies all major components involved in interaction","It considers the user's view"],"answer":3,"explanation":"Considering the user's view is a Norman advantage (along with being clear and intuitive, and allowing detailed work within a common framework). The other three are Abowd and Beale advantages.","source":"notes"},
{"q":"A user wants to undo last week's edit, but the app only offers 'revert to version' and the user cannot work out how to express the intent with it. This is best described as a:","options":["gulf of evaluation","latency problem","gulf of execution","property-sensing problem"],"answer":2,"explanation":"The gulf of execution is the difference between the user's formulation of the action and the actions the system allows. The gulf of evaluation concerns understanding the system's displayed state. Latency is a delay and property sensing is about sensing force.","source":"notes"},
{"q":"Which statement defines the gulf of evaluation?","options":["The distance between the physical presentation of the state and the user's expectation","The difference between the user's formulation of an action and the actions the system allows","The ratio between movement of the controller and movement of the display","The delay between an input action and the corresponding output"],"answer":0,"explanation":"The gulf of evaluation is the distance between the physical presentation of the system state and what the user expects. The difference between the user's formulated action and the allowed actions is the gulf of execution, the controller-to-display ratio is gain and transfer, and the input-to-output delay is latency.","source":"notes"},
{"q":"Controller-display relationships are sometimes called:","options":["frameworks","mappings","gulfs","interfaces"],"answer":1,"explanation":"The relationship between what a user does and how the system responds is sometimes called mappings. Frameworks are models like Abowd and Beale, gulfs are gaps in execution or evaluation, and the interface is the translation layer.","source":"notes"},
{"q":"An experienced user clicks a toolbar icon without looking because it has always been in the same place. Which concept explains this?","options":["Latency between input and display","Spatial memory (spatial mapping)","Gain and transfer functions","Property sensing of force input"],"answer":1,"explanation":"Spatial memory is the ability to learn the location of objects by interacting with them repeatedly, giving automaticity when accessing data. The other options concern delay, controller-to-display ratio, and sensed force.","source":"notes"},
{"q":"Which statement best defines gain and transfer functions?","options":["The delay between an input action and the output, in milliseconds","The ratio between controller movement and display movement","Sensing the force a user applies and turning it into device input","The ability to learn the location of objects through repetition"],"answer":1,"explanation":"Gain and transfer functions describe the ratio between movement of the controller and movement of the display. The input-to-output delay is latency, sensing force is property sensing, and learning object locations through repetition is spatial memory.","source":"notes"},
{"q":"Latency is best defined as:","options":["the ratio between controller movement and display movement","the force sensed from a user's grip or tap on a device","the ability to learn where objects are by repeated interaction","the delay between input action and output, in milliseconds"],"answer":3,"explanation":"Latency is the delay between an input action and the corresponding display or output, measured in milliseconds. The controller-to-display ratio is gain, sensing force is property sensing, and learning locations through repetition is spatial memory.","source":"notes"},
{"q":"Which factor is cited as a cause of latency?","options":["The physical size of the display panel being used","The number of keys on the keyboard layout used","The color depth and resolution of the monitor used","Server distance and in-between routers"],"answer":3,"explanation":"Latency is usually caused by network hardware, the server's location, and the internet routers between the server and the user's devices. Display size, key count, and resolution are not cited causes.","source":"notes"},
{"q":"Which pair of typical audio latencies is correct for a regular wired connection versus Bluetooth?","options":["Wired about 30-60 ms; Bluetooth about 5-10 ms ideally, up to 100-300 ms","Wired about 100-300 ms; Bluetooth about 30-60 ms ideally, down to 5-10 ms","Wired about 5-10 seconds; Bluetooth about 30-60 seconds ideally, to 300 s","Wired about 5-10 ms; Bluetooth about 30-60 ms ideally, up to 100-300 ms"],"answer":3,"explanation":"Wired audio is typically 5-10 ms, while Bluetooth ranges from an ideal 30-60 ms up to 100-300 ms for true wireless earbuds. The options that reverse the order are wrong, and the option using seconds uses the wrong unit (latency is measured in milliseconds).","source":"notes"},
{"q":"Which mapping type senses the force given by the user and transforms it into input for a device?","options":["Gain and transfer functions","Latency","Property sensing","Spatial mapping"],"answer":2,"explanation":"Property sensing senses the user's force and turns it into device input. Gain adjusts the controller-to-display ratio, latency is delay, and spatial mapping relies on learned locations.","source":"notes"},
{"q":"In property sensing, which set names the properties sensed by the controller?","options":["Latency, gain, ratio, and network hardware","Domain, goal, task, and task language","Position, displacement, force","Input, output, core language, and task"],"answer":2,"explanation":"Property in this context refers to the actions sensed by the controller: position, displacement, and force. The other options mix up terms from other sections.","source":"notes"},
{"q":"Which set lists interaction technologies commonly found on mobile devices?","options":["Multitouch, accelerometers, fingerprint and face scanners, gyroscopes","Trackballs, light pens, joysticks, barcode scanners, and dial pads","Keyboards, mice, microphones, desktop speakers, and webcams","Punch cards, command lines, function keys, serial ports, and floppy drives"],"answer":0,"explanation":"Mobile devices commonly offer touchscreens and multitouch, accelerometers, fingerprint scanners, face scanners, and gyroscopes. These introduced interactions that were not previously available on desktops, and the other sets are older or desktop-oriented technologies.","source":"notes"},
{"q":"Which pair names the two interaction frameworks introduced for determining how a user and system interact?","options":["Fitts's law for pointing and Hick's law for choice reaction time","Abowd and Beale framework; Norman's execution-evaluation cycle","GOMS goals-operators-methods-selection rules and the keystroke-level model","Nielsen's ten usability heuristics and Shneiderman's eight golden rules"],"answer":1,"explanation":"Determining an interaction framework means choosing between the Abowd and Beale framework and Norman's execution-evaluation cycle. The other pairs are real HCI concepts but are not the frameworks covered in this module.","source":"notes"},
{"q":"Which statement about Norman's execution-evaluation cycle is NOT true?","options":["Step 1 is the user establishing a goal","Step 6 is the user interpreting the system response","Step 5 is the user executing the action on the interface","Step 7 is the user evaluating the system with respect to the goal"],"answer":2,"explanation":"Executing the action on the interface is Step 4. Step 5 is perceiving the system state. The other three statements correctly state Steps 1, 6, and 7.","source":"notes"},
{"q":"Which pairing of mapping type and description is mismatched?","options":["Spatial mapping: relies on spatial memory of object locations learned through repeated interaction","Latency: the delay between an input action and the corresponding display or output","Gain and transfer functions: the delay, in milliseconds, between an input action and the output","Property sensing: sensing the force given by the user and transforming it into device input"],"answer":2,"explanation":"Gain and transfer functions are the ratio between controller movement and display movement. The delay in milliseconds is latency. The other three pairings are correct.","source":"notes"},
{"q":"In which order do the evaluation steps of Norman's cycle occur?","options":["Perceive the system state, interpret the system response, evaluate against the goal","Interpret the system response, perceive the system state, evaluate against the goal","Evaluate against the goal, perceive the system state, interpret the system response","Perceive the system state, evaluate against the goal, interpret the system response"],"answer":0,"explanation":"Evaluation runs Step 5 perceive the system state, Step 6 interpret the system response, Step 7 evaluate the system with respect to the goal. The other orders scramble these steps.","source":"notes"}
]
