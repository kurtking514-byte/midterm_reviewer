2 Communication and Globalization
Understanding how communication connects people and places around the world

MODULE OVERVIEW

★ Learning objectives: define globalization; introduce kinds of globalization; determine positive and negative effects; define glocalization.
EASIER: Explain globalization, its effects, and how global ideas can be adapted for local communities.

DEFINITIONS

★ Globalization is integrating a country’s economies, societies, and cultures with the world through exchange of goods, services, information, and ideas among people and nations.
EASIER: Globalization connects countries through what they buy, sell, share, and how people communicate. Think of a web linking communities.
★ Globalization is driven by international trade and investment, aided by information technology.
EASIER: Trade and investment connect countries; technology helps people share information quickly.
★ Glocalization combines globalization and localization.
★ Glocalization adapts global products, services, ideas, or cultural elements to the preferences and needs of a local or regional audience.
EASIER: It is like changing a recipe to use familiar local ingredients while keeping its basic idea.

POSITIVE EFFECTS

★ Easy access to information is a major effect of globalization, according to Nikolay Daney (2017).
EASIER: People can find and share information from around the world more easily.
★ Businesses can expand to other markets, offering products and services to a larger audience.
EASIER: A business can find customers in other regions or countries.
★ The language gap gets smaller when companies communicate with customers in their native language.
★ Native-language communication helps companies connect with customers and create fairer, more personal experiences.
EASIER: Customers may understand a product better in a language they use comfortably.
★ Globalization gives companies access to a diverse pool of talents.
★ More companies operate remotely and hire globally.
EASIER: Companies can work with people in many places who bring different skills.
★ Globalization supports transfer of technology and knowledge sharing.
★ Opening borders can lead to greater innovation, breakthroughs, and growth.
EASIER: People can build on one another’s ideas when they share knowledge and technology.

NEGATIVE EFFECTS

★ Cultural homogenization happens when dominant foreign cultures influence local culture and make global culture more uniform.
EASIER: Local customs can become less visible when similar global trends spread widely.
★ Globalization can be associated with financial crises and inequality.
★ Although globalization has been shown to decrease poverty overall, this can be at the expense of local businesses and populations.
EASIER: Some benefit while local communities or businesses face costs or stronger competition.
★ The environmental toll can include decreased biodiversity and the spread of invasive species.
★ These effects can impact agriculture, wildlife, and ecosystems worldwide.
EASIER: Species spreading where they do not naturally belong can disrupt local habitats.

GLOBAL COMMUNICATION ACTIVITIES

★ The prior-knowledge activity asks for a word or phrase for each letter in GLOBALIZATION.
★ Example: “G — Global understanding.”
⚙ Write one word or phrase for each of the thirteen letters: G, L, O, B, A, L, I, Z, A, T, I, O, N.
★ In the pair activity, a group chooses and briefly introduces an item that best represents globalization.
★ The group gives at least two positive and two negative effects of its example in globalization and communication.
★ Preparation is 10 minutes; presentation is 2–3 minutes.
★ The activity is worth 10 points: 3 for introducing the item, 4 for at least two positive and two negative effects, and 3 for the presentation.
★ Write group members and the chosen item; no written explanation is needed.
EASIER: Use a familiar object to explain global connections, benefits, and drawbacks.
⚙ Form a group and choose a representative item.
⚙ Prepare its introduction and at least two positive and two negative effects.
⚙ Prepare for 10 minutes, then present for 2–3 minutes.
⚙ Record group members and the chosen item; writing the explanation is unnecessary.

GLOCALIZATION EXAMPLES

★ Listed areas: fast food chains, Starbucks, language and advertising, entertainment, technology, fashion, food and beverages.
EASIER: Each is an area where global products or ideas may be adjusted for local preferences.
EXAMPLE: FAST FOOD CHAINS
⚙ Added example: A global chain offers a menu item using flavors popular in one region.
EXAMPLE: STARBUCKS
⚙ Added example: A location offers a drink or food item reflecting local tastes under the global brand.
EXAMPLE: LANGUAGE AND ADVERTISING
⚙ Added example: A company translates an advertisement and adapts wording or images for local customers.
EXAMPLE: ENTERTAINMENT
⚙ Added example: A streaming service offers a local-language version of a show.
EXAMPLE: TECHNOLOGY
⚙ Added example: A global app adapts language, payment options, or features for local users.
EXAMPLE: FASHION
⚙ Added example: An international clothing brand adjusts designs, sizes, or materials for local preferences or climate.
EXAMPLE: FOOD AND BEVERAGES
⚙ Added example: A global brand creates a flavor using ingredients familiar in one area.

EXIT TICKET: CREATE A GLOCALIZATION IDEA

★ The exit ticket is an individual activity worth 30 points.
★ Create an original glocalization idea related to your course or interest.
★ Provide a kind of glocalization, a title, a drawing or design, and an explanation of the item and how it works.
★ The explanation must have at least five sentences.
★ Rubric: 2 points for kind, 5 for title, 8 for drawing/design, 10 for an explanation of at least five sentences, and 5 for uniqueness.
EASIER: Invent something global adapted for local people, give it a title, design it, and explain it in at least five sentences.
⚙ Choose a course or interest connected to a local community.
⚙ Decide what global product, service, idea, or cultural element to adapt.
⚙ Title and draw or design the item.
⚙ Explain what it is and how it works in at least five sentences.
⚙ Check all rubric categories and make the idea unique.
EXAMPLE: GLOCALIZED STUDY APP
⚙ Added example: Design a global study app with local-language explanations and community examples.
⚙ Added example: Title and sketch it, then write at least five sentences explaining its features and use.

COMMON MISTAKES

★ Glocalization is more than spreading a global product; it requires adapting it to local or regional preferences and needs.
EASIER: If nothing changes for the local audience, it is not clearly glocalization.
★ Cultural homogenization makes cultures more uniform; glocalization adapts global elements to local audiences.
★ Three disadvantages: cultural homogenization, financial crises and inequality, environmental toll.
★ Five advantages: information access, market expansion, smaller language gap, diverse talent, technology transfer and knowledge sharing.

EXAM TIPS

★ Recall advantages as information, markets, language, talent, and technology/knowledge.
★ Recall disadvantages as cultural uniformity, financial crises/inequality, and environmental harm.
★ To explain glocalization, name the global element, local audience, and adaptation.
EASIER: Ask: What is global? Who is the local audience? What changed for that audience?

SELF-TEST

Q: What makes an example glocalization rather than simply globalization?
★ Glocalization adapts a global product, service, idea, or cultural element to local or regional preferences and needs.
Q: Name one positive and one negative effect.
★ Easier information access is positive; cultural homogenization is negative.

1 Communication Process, Principles, and Ethics
A clear guide to language, the communication process, and responsible communication

MODULE OBJECTIVES
★ The module aims to define language, dialect, and accent; explain the communication process; describe communication models; and identify ethics and principles for effective communication.
EASIER: Learn what language varieties are, how messages move between people, and how to communicate responsibly.
★ Class reminders: Be confident without being rude, respect everyone, follow the two-ears-one-mouth policy, attend class, submit activities on time, participate actively, expect oral presentations, and do not use gadgets.
EASIER: Listen carefully, treat classmates respectfully, and meet class expectations.

LANGUAGE, DIALECT, AND ACCENT
★ Language is a system of communication made up of sounds, words, and grammar.
EASIER: A language gives people shared sounds and rules for expressing meaning, much like a shared code.
★ A dialect is a variation of a language associated with a particular region, social group, or community.
★ Dialects may differ from a standard or prestige language in pronunciation, vocabulary, and grammar.
EASIER: A dialect is a recognizable variety of a language used by a community; it is not simply an incorrect form.
★ An accent is a distinctive way of pronouncing a language, especially one associated with a particular nation, locality, or social class.
EASIER: An accent concerns how words sound. Two people may use the same words and grammar but pronounce them differently.
★ Major dialects that enrich the Filipino language include Tagalog, Cebuano, Ilokano, Ilonggo, Bicolano, Waray, Pangasinense, and Kapampangan.
★ The module states that there are over 7,000 different forms of language in the world.
★ Languages change through time.
★ All languages have grammatical categories.
★ New words enter dictionaries.
★ Language is arbitrary: words and symbols generally have meanings because communities agree on them, not because the sounds naturally resemble the things they represent.
EASIER: The word “tree” does not look or sound like a tree; English speakers have learned to connect that word with the object.
★ The module identifies pneumonoultramicroscopicsilicovolcanoconiosis as the longest word in the English language.
EASIER: This is a very long technical word; remember the spelling as presented in the module.
★ The module describes communication as more of an art than a science.
EASIER: Communication involves judgment about people and situations, even though it can also be studied systematically.
★ Communication is a natural ability.
★ Great vocabulary is essential for effective communication.
★ More communication is always better.
★ Telling clearly and confidently is the secret of communication.
★ Written communication is the fastest way to get a response.
EASIER: These five statements appeared as a true-or-false activity. They are not all reliable rules: effectiveness depends on the situation, and a larger vocabulary or written message does not guarantee better or faster understanding.
⚙ Class group activity: Form groups of five and choose five languages or dialects. Groups must not repeat another group’s choices.
⚙ Give examples of five words or phrases for each chosen language or dialect, for at least 25 words or phrases total.
⚙ Give the English equivalent meaning for each word or phrase.
⚙ The activity is worth 30 points: 25 points for the words or phrases and 5 points for presentation and translation.
EXAMPLE: LANGUAGE AND DIALECT
⚙ If a group chooses five languages, it should provide at least five words or phrases from each one, translate all of them into English, and present the results.
⚙ Check that the five languages or dialects do not duplicate another group’s selections.

COMMUNICATION
★ John Adair defines communication as essentially the ability of one person to make contact with another and make himself or herself understood.
★ William Newman and Charles Summer define communication as an exchange of ideas, facts, opinions, or emotions between two or more persons.
★ Louis Allen describes communication as a bridge of meaning.
★ Newstrom and Keith Davis define communication as the transfer of information from one person to another and a way of reaching others by transmitting ideas, feelings, thoughts, facts, and values.
★ Theo Haimann defines communication as the process of passing information and understanding from one person to another.
EASIER: These definitions share the idea of connecting with others and sharing information or meaning so it can be understood.
★ Communication is dynamic, continuous, complex, irreversible, non-sequential, and unrepeatable.
EASIER: Communication changes as people and situations change; it keeps unfolding, can involve many factors, cannot be fully taken back, need not follow a straight sequence, and cannot be recreated in exactly the same way.
★ The module lists five goals of communication: to get and give information, to get action, to persuade, to change behavior, and to ensure understanding.
★ The module presents “What is communication and why do we communicate?” as a guiding question.
EASIER: People communicate to exchange information and meaning, influence action or behavior, persuade, and check understanding.
★ The module presents the statement “Communication is much more of an art than science.”
EASIER: Skilled communication requires judgment and adaptation, although theories and evidence can help explain it.

ELEMENTS OF COMMUNICATION
★ Context is the environment where an interaction happens.
★ Physical context is the place where communication happens, such as a school or restaurant.
★ Psychological context is what participants bring to an interaction, such as needs, desires, and values.
★ Social context concerns the relationship between speaker and listener, including the expectations involved.
★ Cultural context includes learned behaviors and rules that affect an interaction, such as body movements, facial expressions, and practices.
EASIER: Context is the situation around a conversation: where it happens, what people bring to it, how they relate, and which learned customs shape it.
★ The sender, or speaker, is the source of the message and encodes it through speaking or writing.
★ The sender initiates communication by sending a message of information.
★ Encoding is transforming abstract opinions and ideas into symbols such as words, pictures, signs, and marks.
★ The message is the idea, information, or topic the communicator sends to the receiver to get feedback.
★ The message is the key element of any communication process.
★ The channel is the means or way a message is sent; examples include in-person meetings, phone calls, text messages, and email.
★ Noise is a barrier that affects a message being sent, received, or understood.
★ The module lists six forms of noise: physical, physiological, semantic, psychological, technical, and cultural.
★ Physical noise is an external sound or disturbance that interferes with communication, such as traffic honking.
★ Physiological noise arises from a bodily condition that makes sending or receiving a message difficult.
★ Semantic noise occurs when words, signs, or sentence construction make a message confusing or ambiguous.
★ Psychological noise arises from a person’s thoughts, emotions, or mental state and distracts from communication.
★ Technical noise is interference or failure involving communication equipment or transmission.
★ Cultural noise arises when differences in cultural knowledge, practices, or language interfere with understanding.
EASIER: Noise is anything that gets in the way of intended meaning. It can come from surroundings, a person’s body or mind, unclear language, technology, or cultural differences.
★ Decoding is translating or understanding the message; decoding is the first stage in listening.
★ The receiver is the audience member who decodes the message to recognize its meaning.
★ Feedback is a reaction, response, or information provided by the receiver.
★ Feedback completes the process because it affirms the receiver’s interpretation of the message.
EASIER: The sender forms an idea, puts it into a message, sends it through a channel, and the receiver interprets it. The receiver’s response gives evidence of how the message was understood.
⚙ Communication process: sender → encoding → message through a channel → decoding → receiver → feedback.
⚙ Noise can affect the message as it is sent, received, or understood.
EXAMPLE: ASKING A CLASSMATE TO SHARE NOTES
⚙ The sender decides to ask for notes and encodes that idea in spoken words or a text message.
⚙ The message is the request to share notes, and the channel is speech or text messaging.
⚙ The receiver decodes the request and replies; that reply is feedback.
⚙ Background traffic, a poor phone connection, unfamiliar wording, or distraction can introduce noise.

MODELS OF COMMUNICATION
★ The linear communication model presents communication as a one-way, straight-line process: speakers speak, listeners listen, and there is no immediate feedback.
★ Linear communication is common in mass communication such as television, radio, newspapers, commercials, and print materials.
★ The module credits Shannon and Weaver with presenting the linear communication model in 1948 through A Mathematical Theory of Communication.
EASIER: A broadcast is a useful example of linear communication: one source sends a message to an audience without an immediate reply in the same channel.
★ The interactive communication model describes participants alternating positions as sender and receiver.
★ In the interactive model, participants create meaning by sending messages and receiving feedback within physical and psychological contexts.
★ The interactive model is a two-way process.
★ The module identifies the interactive communication model with Schramm (1955).
EASIER: In a conversation, one person speaks, the other responds, and then their roles may switch.
★ The transactional communication model shows that communication elements are interdependent.
★ In the transactional model, each person is both speaker and listener and can send and receive messages simultaneously.
★ Transactional communication is ongoing and continuously changing as participants and their environment change.
★ The module identifies the transactional communication model with Barnlund (1970).
EASIER: During a face-to-face conversation, people can speak, listen, react, and adjust at the same time; each person’s behavior can influence the other.
EXAMPLE: THREE MODELS
⚙ A television announcement with no immediate audience response illustrates the linear model.
⚙ A conversation in which two people take turns sending messages and responding illustrates the interactive model.
⚙ A live conversation in which both people send signals, listen, react, and adjust simultaneously illustrates the transactional model.
⚙ Distinguish the models by asking whether communication is one-way, alternating two-way, or simultaneous and interdependent.

PRINCIPLES OF COMMUNICATION: THE 7 CS
★ The module lists the 7 Cs of Communication as completeness, conciseness, consideration, concreteness, courtesy, clearness, and correctness.
★ Completeness means including the information the audience needs.
★ Conciseness means expressing the message without unnecessary words.
★ Consideration means taking the audience’s needs and perspective into account.
★ Concreteness means using specific, definite details rather than vague language.
★ Courtesy means communicating respectfully.
★ Clearness means making the meaning easy to understand.
★ Correctness means using accurate information and appropriate language.
EASIER: The 7 Cs are a checklist: include what is needed, keep it economical, consider the audience, be specific, be respectful, be clear, and be accurate.
EXAMPLE: APPLYING THE 7 CS
⚙ Before sending an announcement, check that it includes needed details, removes unnecessary wording, considers readers, gives specific information, uses a respectful tone, is easy to understand, and is accurate.

ETHICS OF COMMUNICATION
★ Ethics is an area of philosophy that determines or judges what is right or wrong.
★ Ethical communication helps people make decisions about how to structure messages and choose words appropriate to a situation.
EASIER: Ethics asks whether a message is responsible and fair as well as whether it can be understood.
★ Ethical communicators respect their audiences.
★ Respectful communication considers who the audience is, including social and economic background, experience, and current psychological and mental mindset.
★ The Golden Rule for respect is to treat others the way we want to be treated.
★ Ethical communicators weigh the consequences of their actions.
★ Every word sent can influence or affect the lives of an audience.
★ The Golden Rule for consequences is: think before you click and think before you speak.
★ Ethical communicators value truth; truth is a core value and a major currency in communication.
★ The Golden Rule for truth is to respect the truth.
★ Ethical communicators know how to use information properly, are adequately informed, and communicate accurately.
★ The module states that misinformation is one of the worst offenses by a communicator and goes against communication principles.
★ Ethical communicators do not falsify information.
★ Distorting facts and making things up are both forms of dishonesty.
★ The module calls the idea that a frequently repeated lie becomes truth the “Big Lie Philosophy.”
EASIER: Check information before sharing it, do not distort or invent facts, consider how words may affect people, and treat the audience with respect.
EXAMPLE: RESPONSIBLE MESSAGE
⚙ Before posting a claim, check whether the information is accurate, consider how the audience may be affected, choose appropriate words, and avoid changing or inventing facts.

COMMON MISTAKES
★ A dialect is a variety of a language; an accent specifically concerns pronunciation.
★ Do not assume that more communication, a large vocabulary, or written communication automatically produces effective or fast communication.
★ Do not confuse the channel with the message: the message is what is communicated, while the channel is how it is sent.
★ Do not confuse decoding with encoding: the sender encodes; the receiver decodes.
★ Do not treat noise as only loud sound; noise can also be physiological, semantic, psychological, technical, or cultural.
★ Do not confuse the linear, interactive, and transactional models: they describe one-way flow, alternating two-way exchange, and simultaneous interdependent exchange, respectively.
★ The module’s references are Josue M. (2023), Purposive Communication in Diverse Contexts; Cayaban N. (2022), Purposive Communication in the 21st Century; and Mariveles H. (2021), Purposive Communication, Second Edition.

EXAM TIPS
★ Memorize the communication scholars with their central ideas: Adair, contact and being understood; Newman and Summer, exchange; Allen, bridge of meaning; Newstrom and Davis, transfer of information and ideas; Haimann, passing information and understanding.
★ Memorize the process in order: sender, encoding, message and channel, decoding, receiver, feedback.
★ For noise questions, identify whether the cause is surroundings, bodily condition, unclear meaning, mental state, technology, or cultural difference.
★ For model questions, identify whether feedback is absent immediately, roles alternate, or participants communicate simultaneously.
★ For ethics questions, check respect, consequences, truth, accurate information, and honesty.

SELF-TEST
Q: What are the three communication models, and how does the flow differ in each?
★ The linear model is one-way with no immediate feedback; the interactive model is two-way with participants alternating sender and receiver roles; the transactional model is simultaneous and interdependent, with each participant both sending and receiving.

<script type="text/plain" id="notes-eng100-lesson3">
3 Local and Global Communication in Multicultural Settings
Understanding cultural diversity, intercultural sensitivity, and respectful language

MODULE OVERVIEW

★ Learning objectives: define cultural diversity; adapt cultural awareness and sensitivity; apply the Developmental Model of Intercultural Sensitivity; determine culturally appropriate terms.

CULTURE

★ Culture includes beliefs, values, norms, behaviors, and a person’s overall way of being.
EASIER: Culture is a guide people use to understand the world and interact.
★ Cultural diversity, synonymous with multiculturalism, recognizes cultural, racial, and ethnic differences, particularly those of minority groups, within a dominant political culture.
★ Cultural awareness means knowing multiple cultures exist and can have different attitudes and outlooks based on religion, ethnicity, nationality, and other factors.
★ Cultural sensitivity means accepting differences without insisting one’s culture is better or everyone should do things one’s way.
★ Ethnocentrism is the attitude that one’s own group, ethnicity, or nationality is superior to others.
★ Ethnorelativism is an acquired ability to see many values and behaviors as cultural rather than universal.
★ Cultural stereotypes rely on limited observed characteristics and often cause oversimplification and misinterpretation.
EASIER: Do not generalize about a group from a few observations.

COMMUNICATION STYLES

★ High-context communication conveys much meaning indirectly through context, relationships, shared experiences, tone, nonverbal cues, and what is left unsaid.
★ Low-context communication conveys meaning explicitly through clear, direct, specific words.
★ Cultures may tend higher or lower context, but individuals differ by personality, situation, profession, age, language proficiency, and relationship.
★ Multicultural communication occurs when people from different cultural backgrounds interact and exchange information.
⚙ In cross-cultural communication consider words, context, relationships, tone, nonverbal cues, and implied meaning.
⚙ Treat cultural tendencies as general examples, not as descriptions of every individual.
★ Generally more high-context examples: Japan, China, South Korea, Thailand, Indonesia, Philippines, India, Saudi Arabia / Arab cultures, Mexico, Italy, Spain, Brazil.
★ Generally more low-context examples: United States, Germany, Switzerland, Sweden, Canada, Australia, United Kingdom, Netherlands, Denmark, Norway, New Zealand, Austria.

CULTURAL DIVERSITY IN EDUCATION

★ Educational contributions listed: learning and growth, deep confidence, empathy, and preparation for the future.
★ Diversity benefits listed: new opportunities, compassion, innovation, productivity, and problem-solving.

DMIS

★ The Developmental Model of Intercultural Sensitivity (DMIS), developed by Dr. Milton Bennett, describes stages of intercultural sensitivity and competence as people engage across cultures.
★ Six stages: Denial, Defense, Minimization, Acceptance, Adaptation, Integration.
⚙ Memorize: Denial → Defense → Minimization → Acceptance → Adaptation → Integration.

GENDER-SENSITIVE LANGUAGE

★ Alternatives: mankind → people, humanity, or human beings; man-to-man defense → one-on-one defense; man the operation → staff the operation; manpower → labor or human resources; layman’s term → ordinary term.
★ Alternatives: chairman → chairperson; policeman → police officers; sales girl → sales clerk; spokesman → spokesperson; lady lawyer → lawyer.
★ Neutral examples: “Each student should hand in their term paper by tomorrow”; “Nurses care for their patients.”
★ “She shoots well” describes ability directly; “She shoots like a man” makes a gender comparison.
★ “A brilliant researcher” describes achievement without gender qualification.
★ Be respectful about a person’s gender, orientation, and sexual preference.
⚙ Use neutral pronouns where gender is unknown or irrelevant; describe skills directly rather than by gender.

AGE, RACE, RELIGION, AND DISABILITY

★ Ageist examples: “You’re too old to understand technology. Let the younger staff handle it” and “You’re too old to learn new things.”
★ Age-sensitive examples: “Your experience is valuable, and we can provide training and support to ensure you are comfortable with technology” and “People of all ages are capable of learning and adapting to new challenges.”
★ Race examples contrast “A Chinese national was caught” with “A man was caught,” and “She is pretty for an Aeta” with “She is pretty,” illustrating removal of irrelevant labels or qualifiers.
★ Respectful faith example: “Our club welcomes members of all faiths and backgrounds who share our interests,” instead of requiring one religious belief.
★ Respectful disability examples: “a child who has autism” and “a person who is visually impaired.”
⚙ Revise wording by identifying assumptions, checking relevance, removing unnecessary labels, and stating relevant information respectfully.
⚙ Replace age-based assumptions with wording recognizing experience and learning ability.
⚙ Welcome people of all faiths when membership is based on shared interests; use respectful disability wording.

EXAMPLE: REVISING WORDING

⚙ Step 1: Identify assumptions about gender, age, race, faith, or disability.
⚙ Step 2: Decide whether the information is relevant.
⚙ Step 3: Remove an unnecessary assumption or label.
⚙ Step 4: State relevant information respectfully and directly.
⚙ Example: Replace “You’re too old to learn new things” with “People of all ages are capable of learning and adapting to new challenges.”
⚙ Example: Replace “She shoots like a man” with “She shoots well.”

COMMON MISTAKES

★ Awareness recognizes differences; sensitivity accepts differences without claiming superiority.
★ Ethnocentrism claims superiority; ethnorelativism recognizes cultural variation.
★ High-context communication relies more on context and indirect cues; low-context communication uses explicit wording.
★ Country-level communication lists describe tendencies, not every individual.
★ Stereotypes generalize from limited observations and can misinterpret people.
★ Avoid irrelevant assumptions and labels about gender, age, race, religion, or disability.

EXAM TIPS

★ DMIS order: Denial, Defense, Minimization, Acceptance, Adaptation, Integration.
★ Diversity benefits: new opportunities, compassion, innovation, productivity, problem-solving.
★ Education contributions: learning and growth, deep confidence, empathy, preparation for the future.

SELF-TEST

Q: What is the difference between awareness and sensitivity?
★ Awareness recognizes cultural differences; sensitivity accepts them without claiming superiority.
Q: Name the DMIS stages in order.
★ Denial, Defense, Minimization, Acceptance, Adaptation, Integration.
Q: Name five benefits of cultural diversity.
★ New opportunities, compassion, innovation, productivity, and problem-solving.
Q: Give an alternative to “chairman.”
★ Chairperson.

<script type="text/plain" id="notes-HIST100-unit1">
Unit 1
The Meaning and Importance of History and Historical Sources

MEANING AND IMPORTANCE
★ History is an evidence-based interpretation of the past, built by studying surviving traces such as documents, photographs, laws, maps, artifacts, oral testimony, buildings, and digital records.
★ Dates establish sequence; sources provide evidence; analysis explains relationships, causes, significance, perspectives, and limitations.
★ History helps explain identity, society, power, communities, and institutions, and develops evidence-based thinking.
EASIER: Dates order the clues, sources provide clues, and analysis explains what the clues may mean.

THE W’S OF HISTORY
★ Who identifies participants and visible or missing voices. What identifies the event or process. When establishes chronology. Where supplies geographical and local context. Why asks causes and significance. How asks change, continuity, and supporting evidence.
★ An event is a specific happening at a time and place; a process is long-term change such as colonization or migration.
★ Before-event sources may show background; during-event sources may show immediate experience; later sources may reflect consequences or memory. Chronology prevents events from being mixed.
★ Historical narratives may preserve leaders and elites more visibly than women, Indigenous peoples, workers, and ordinary citizens.
EASIER: Ask who, what, when, where, why, and how.

THEORY LENSES
★ Great Man / Hero-centered: individuals and decisions; useful for leadership and biography, may overlook broader conditions.
★ Cyclical: recurring rise, growth, peak, crisis, breakdown, renewal; change may not repeat neatly.
★ Linear / Progress: forward development; useful for reforms, technology, institutions, may assume later is always better.
★ Materialist / Marxist: economy, class, ownership, labor, conflict; reveals inequality, may underplay culture, religion, choice.
★ Annales / Social History: everyday life and ordinary people, including work, food, belief, communities.
★ Postcolonial / Filipino-centered: colonial power, Filipino voices, bias, local meaning, resistance, agency, silenced views.
★ A theory lens emphasizes parts of an event; it should explain evidence, not replace it.
EASIER: Lenses focus attention differently; keep checking the evidence.

HISTORICAL SOURCES
★ Written sources (letters, laws, newspapers) offer statements, rules, arguments, accounts. Visual sources (photos, maps, posters) offer visual or spatial evidence.
★ Oral sources (interviews, testimonies) offer memory and spoken perspectives. Material sources (artifacts, buildings, clothing) offer physical clues about life, technology, culture, environment.
★ Digital sources (posts, videos, metadata) require checks of origin and alteration history.
★ Primary sources are from the period or directly connected to it: diaries, letters, photos, maps, laws, speeches, artifacts. They are not automatically accurate.
★ Secondary sources interpret primary sources: history books, journal articles, documentaries. Tertiary sources summarize: encyclopedias, timelines, glossaries.
★ Type depends on the research question. Philippine examples: Kartilya ng Katipunan (revolutionary ideals); 1898 Declaration (political claims); Rizal writings (nationalist thought); 1987 Constitution (legal-political framework); old photos/maps (visual-spatial evidence); oral testimony (memory and lived experience).
★ Fame, official status, and age do not remove the need to check authorship, context, purpose, provenance, and limitations. Match claims to what evidence can establish.

PROVENANCE, AUTHENTICITY, CREDIBILITY
★ Provenance is origin and preservation history: creator, date/place, audience, preservation, and path to the present. Unclear creator, date, archive, or transmission calls for caution.
★ Authenticity asks if a source is genuine or accurately reproduced. Physical clues: paper, ink, seal, signature. Digital: metadata, upload history, file origin. Content: language, dates, names. Expert: archive records and catalogs.
★ Appearance alone does not prove authenticity; an authentic source can still be biased, inaccurate, or limited.
★ Credibility asks whether claims are trustworthy for a specific question. Assess author knowledge/access/perspective, purpose (inform, persuade, justify, explain), and corroboration from other sources.
★ Provenance asks where from; authenticity asks genuine; credibility asks trustworthy for this question. Explain source limits, not just “reliable/unreliable.”
EASIER: A real source can still be mistaken or biased.

HISTORICAL CRITICISM AND THINKING SKILLS
★ Historical criticism judges authenticity, meaning, accuracy, and reliability.
★ External criticism checks origin/authenticity: authorship, date, place, form (original/copy/translation), condition (altered/damaged/edited), provenance.
★ Internal criticism checks what it says: wording, purpose, audience, bias, plausibility, and silences. A genuine source can be inaccurate or misleading.
★ Sourcing asks who made it and why; contextualizing asks what was happening; close reading asks what it says/shows; corroborating asks what other sources say.
⚙ Source it, contextualize it, read it closely, and compare it with other evidence.

SOURCE EVALUATION MATRIX
★ Rate provenance, authenticity, credibility separately as High/Medium/Low; usefulness as Strong/Limited. A source may have clear provenance but moderate credibility, or limited usefulness for a broad claim.
⚙ Evaluate each criterion separately and explain support and limitations.

EXAMPLE: HISTORICAL PHOTOGRAPH
⚙ Claim: “This photo proves the whole event.” Ask who took it, when and where, whether staged/cropped/captioned later, what is outside the frame, and whether written/oral sources corroborate it.
⚙ Match conclusion to evidence. One photo may support a limited claim about its frame but may not explain an entire event.
EASIER: A photo captures one angle and moment; check beyond the frame.

COMMON MISTAKES
★ Do not treat history as memorization alone, primary as automatically accurate, age/fame/official status as proof, authenticity as credibility, or one photo as proof of an entire event.
★ Do not classify without the research question, let theory replace evidence, ignore missing voices, or mix events without chronology.

EXAM TIPS
★ Identify the question; evaluate provenance, authenticity, credibility, usefulness. Keep external and internal criticism distinct. Use all six W’s; compare theory emphasis and limitation; corroborate broad claims.

SELF-TEST
Q: What are the three core source tests?
★ Provenance, authenticity, and credibility.
Q: What is the difference between event and process?
★ An event is a specific happening; a process is long-term change.
Q: What are the four historical thinking skills?
★ Sourcing, contextualizing, close reading, and corroborating.

<script type="text/plain" id="notes-HIST100-unit2">3.3 Content and Contextual Analysis of Primary Sources
A concise guide to evidence, perspective, and historical meaning

MODULE PURPOSE
★ Analyze primary sources by examining context, content, perspective, value, limitations, and contribution to Philippine history.
★ O-C-P-V-L means Origin, Content, Purpose, Value, Limitation.
⚙ Origin: who made it, when and where, and how connected to the event.
⚙ Content: words, images, symbols, claims, actions, and details present.
⚙ Purpose: why it was created and for whom.
⚙ Value: what historians can learn from it.
⚙ Limitation: what it cannot answer, whose perspective is missing, and how creator's position shapes it.
EASIER: Use O-C-P-V-L as a checklist: who, what, why, what useful, and what missing?

SOURCE TYPES AND CONTEXT
★ A primary source was created during the period studied or by someone closely connected to the event; examples include documents, speeches, photographs, paintings, cartoons, objects, maps, films, and interviews.
★ A secondary source later interprets, explains, compares, or synthesizes past evidence.
★ Classification depends on the research question: a modern documentary is secondary about earlier events but primary evidence of modern memory.
★ Eyewitness and primary do not mean neutral, accurate, complete, or representative.
⚙ Content analysis examines words, images, claims, symbols, tone, and direct or implied meaning.
⚙ Contextual analysis examines creator background, period, audience, institutions, conflicts, and power relations.
★ Historical perspective reconstructs past conditions and choices; presentism judges the past only through current assumptions.
★ Point of view is the creator's position; bias is a tendency to select, emphasize, label, or omit perspectives. Bias does not make a source useless.

ARGUMENT AND EVIDENCE
★ Main argument is the central message the creator wants the audience to accept.
⚙ Find repeated claims, reasons, examples, emotional or legal language, tone, and what the audience is meant to believe, feel, or do.
⚙ Separate direct evidence from opinion or interpretation.
★ Historical importance comes from helping answer a meaningful question, not simply from age or fame.
★ Corroboration compares independent evidence to find agreement, conflict, and gaps.
⚙ Compare creators, dates, places, source types, and perspectives before making broad claims.
★ One source cannot stand for an entire society, region, class, or period.
EASIER: Corroboration is checking more than one witness before making a big conclusion.

SELECTED PHILIPPINE SOURCES
★ Juan de Plasencia's late-sixteenth-century Customs of the Tagalogs is a chronicle and colonial ethnographic account by a Spanish Franciscan missionary.
★ Plasencia describes barangays, datus, social classes, marriage, dowry, inheritance, laws, justice, debt, and religious beliefs, showing organized Tagalog political, legal, social, and religious systems.
★ His missionary-colonial lens, Christian categories, Spanish-language assumptions, Tagalog focus, and Spanish contact limit generalization.
⚙ Use specific evidence, make cautious inferences, and corroborate Plasencia with early accounts, archaeology, material culture, indigenous terms, later ethnography, and evidence from other regions.
★ Antonio Pigafetta's 1519-1522 First Voyage Around the World is an eyewitness travel account from Magellan's expedition.
★ Pigafetta records routes, islands, names, food, rituals, rulers, trade, ceremonies, and conflict during early European contact with Visayan communities.
★ His Cebu account records ships, banners, artillery, interpreters, negotiation, tribute, and trade; local protocols and trade existed before European arrival.
★ Translation barriers, possible misunderstanding, European labels, and expedition perspective limit Pigafetta's account.
⚙ Separate observation from cultural interpretation, compare local evidence, notice power, and avoid projecting later nationalism onto 1521.
★ Emilio Jacinto's 1890s Kartilya ng Katipunan presents membership as moral commitment: discipline, honor, reason, integrity, equality, respect, service, patriotism, and duty.
★ The Kartilya connects honorable individuals, respectful communities, and collective freedom.
★ Ambrosio Rianzares Bautista prepared the Act of the Declaration of Philippine Independence, proclaimed June 12, 1898.
★ The Declaration argues colonial abuses justified separation from Spain and claims sovereignty; it addresses local and foreign audiences during the Spanish-American War.
★ Its praise of American protection amid U.S. nonrecognition, revolutionary leadership perspective, and unequal representation of social and regional views require context and comparison.
★ Juan Luna's Spoliarium (1884) depicts defeated gladiators and won a gold medal at the Madrid Exposition.
★ Its bodies, workers, grieving figures, darkness, and lighting support interpretations of suffering, violence, spectacle, defeat, and grief; its colonial-nationalist meaning is later interpretation, not a photograph of a Philippine event.
★ Fernando Amorsolo painted The Making of the Philippine Flag in 1955, retrospectively depicting the flag sewn in Hong Kong in 1898 by Marcela Agoncillo, Lorenza Agoncillo, and Delfina Herbosa de Natividad.
★ Amorsolo's painting is evidence of later national memory, not eyewitness visual evidence of 1898.
⚙ For paintings, describe visible features first, then interpret composition, color, light, gesture, scale, and symbols in context.
★ Individual American-era cartoons from 1900-1941 are primary sources; the 1985 McCoy-Roces book is a secondary compilation.
⚙ Decode a cartoon by identifying characters and symbols, examining exaggeration, reading caption, finding irony or criticism, and connecting it to context.
★ “Wherever You Go, We Will Follow” (1917) uses Uncle Sam and Little Juan to criticize the contradiction between promoting freedom abroad and withholding independence.
★ A 1917 cartoon contrasts punishment of a poor child over a chicken with powerful “big thieves,” criticizing selective justice; exaggeration needs corroboration.
★ Cartoons reveal public opinion, colonial tensions, elite power, inequality, anxiety, and criticism absent from formal documents, but one cartoon cannot represent every view.
★ The Raiders of Sulu Sea (2008) is secondary evidence about earlier raiding and primary evidence of 2000s historical memory.
⚙ For film, distinguish historical evidence from narration, editing, reenactments, music, visuals, labels, maps, and expert selection.
★ Corazon C. Aquino addressed the U.S. Congress on September 18, 1986, after People Power and constitutional restoration; she argued democracy needed support while the Philippines rebuilt.
★ Ethos appeals to credibility, pathos to emotion, and logos to reasoning.
★ Filipino grievances against Governor-General Leonard Wood concern autonomy, executive power, and Filipino institutions.
★ The 1916 Jones Act expanded elected Filipino institutions and promised eventual independence once stable government was established.
★ Wood's stronger executive supervision and the Conley dispute helped trigger the 1923 Cabinet Crisis; a 1926 protest accused him of arbitrary acts and usurpations.
★ The Wood grievance preserves elite constitutional arguments but does not represent every group or Filipino view.

WRITING ANALYSIS
★ A source-analysis paragraph makes a claim supported by evidence and reasoning, not summary alone.
⚙ Use this order: claim, evidence, reasoning, context, qualification.
⚙ State what the source explains, provide a specific detail, show how it supports the claim, connect historical context, and name a perspective or limitation.
★ Avoid summary without a claim, calling biased sources useless, presentism, treating art as photograph, confusing compilation with original, and treating one source as whole history.
⚙ Build analysis from claim, evidence, context, perspective, and corroboration.

SELF-TEST
Q: What does corroboration help historians do?
★ Compare independent evidence to identify agreement, conflict, and gaps before drawing a broad conclusion.</script>

<script type="text/plain" id="notes-pathfit1-module1">Module 1 Fundamental Movement Skills
The three skill groups: locomotor, non-locomotor, and manipulative

LEARNING OUTCOMES
By the end of this module, the student should be able to do three things.
Outcome one: discuss the three skill groups of the fundamental movement skills.
Outcome two: demonstrate effectively the fundamental movement skills.
Outcome three: appreciate the importance of the fundamental skills through properly performing the movement skills.

ACTIVATING PRIOR KNOWLEDGE
Your teacher may start the lesson with three questions. Try to answer them first, then check the answers below.
Q: What does it mean when we say fundamental? What are fundamental movement skills, then?
★ Fundamental means basic. It is the foundation that other things are built on.
★ Fundamental movement skills are the basic movements of the body that form the foundation for more complex skills in sports, dance, and daily activities.
Q: What are its three skill groups?
★ The three skill groups are locomotor, non-locomotor, and manipulative.
Q: Demonstrate one movement under each skill group.
★ Sample answer: walking (locomotor), bending (non-locomotor), and throwing (manipulative).
EASIER: Think of the alphabet. You must learn the letters first before you can read words. Fundamental movement skills are the letters of movement, and sports are the words and sentences.

THE THREE SKILL GROUPS
★ Locomotor skills are movements done by moving from one place to another.
★ Non-locomotor skills are movements done while staying in one place (stationary).
★ Manipulative skills are movements that include objects to perform a skill.
EASIER: Locomotor means you travel. Your body goes from Point A to Point B, like walking to school.
EASIER: Non-locomotor means you stay. Your feet remain in the same spot, but the body part moves, like bending to tie your shoelace.
EASIER: Manipulative means you handle an object. To manipulate means to handle something, like a ball, with your hands or feet.
EASIER: Memory trick: Travel, Stay, Handle.
EASIER: A quick test. Ask yourself two questions. Is an object used? If yes, it is manipulative. If no object is used, does the body travel to a new place? If yes, it is locomotor. If no, it is non-locomotor.

LOCOMOTOR MOVEMENT SKILLS
★ There are 11 locomotor movement skills: walking, running, jogging, crawling, creeping, hopping, skipping, shuffling, leaping, galloping, and jumping and landing.
EASIER: Locomotion means moving from place to place. Every skill in this list takes the body somewhere.

WALKING
★ Walking is the transfer of weight from one foot to the other while moving forward or backward.
★ In walking, one foot is always in contact with the ground, and the arms swing freely in opposite directions.
EASIER: When you walk, you never fly. There is always at least one foot on the floor.
EASIER: The arms swing opposite to each other. When the right arm swings forward, the left arm swings back.

RUNNING
★ Running is done by propelling oneself rapidly on foot.
EASIER: To propel means to push forward with force. Running is fast walking pushed to the next level.
Added example: In running, there is a moment when both feet are off the ground at the same time. In walking, this never happens.

JOGGING
★ Jogging is faster than walking and slower than running.
EASIER: Think of a speed ladder from slowest to fastest: walking, jogging, running. Jogging is the middle step.

CRAWLING
★ Crawling is being low to the ground and doing a sliding movement, without lifting the belly from the ground.
EASIER: Picture a soldier crawling under barbed wire. The belly stays on the floor the whole time. This is also called the commando crawl.

CREEPING
★ Creeping is done on all-fours (hands and feet), either on your knees or on your toes, while moving around.
EASIER: Picture a baby moving on hands and knees. The belly is lifted off the floor.
EASIER: Everyday speech may call this crawling, but in this module crawling means belly on the ground, and creeping means all-fours with the belly lifted.

HOPPING
★ Hopping is a springing action that involves taking off from one foot and landing on that same foot.
EASIER: Think of playing hopscotch on one foot. You leave the ground with one foot and come down on the same foot.

SKIPPING
★ Skipping is a combination of a step and a hop (step-hop pattern), first on one foot and then on the other.
⚙ Guide procedure for skipping:
⚙ Step 1: Step one foot forward and lift the other foot from the ground.
⚙ Step 2: Hop on the foot that is on the ground.
⚙ Step 3: Then, do the same on the other foot.
EASIER: Say it as a rhythm: step-hop, step-hop. Each foot takes a turn.

SHUFFLING
★ Shuffling is similar to skipping but with a draw backwards instead of a hop.
⚙ Guide procedure for shuffling:
⚙ Step 1: Step one foot forward and lift the other foot from the ground.
⚙ Step 2: Drag the foot that is on the floor backwards, covering a little distance.
⚙ Step 3: Then, do the same on the other foot.
EASIER: Shuffling is a low, sliding version of skipping. Instead of springing up in a hop, the foot drags along the floor for a short distance.

GALLOPING
★ Galloping is not a hop or a skip, and it should never become quick enough for the movement to become a run. This movement mimics a horse's gallop.
★ In galloping, one foot leads while the toes of the back foot chase the heel of the lead foot.
★ In galloping, both feet leave the ground and land on the back foot, followed by the lead foot.
★ While galloping, the knees are slightly bent.
EASIER: Imagine riding a pretend horse. The same foot always stays in front, and the back foot keeps trying to catch up to it.
EASIER: Mimics means copies. You are copying the rhythm of a horse.

LEAPING
★ Leaping is characterized by a take-off on one foot, a long flight phase, and a landing on the opposite foot.
★ In leaping, the strides should be long and cover a farther distance.
EASIER: Think of jumping over a small puddle. You push off one foot, stay in the air for a long moment, and land on the other foot.
EASIER: Flight phase means the time that you are in the air.

JUMPING AND LANDING
★ Jumping and landing is a movement that involves taking off from one or both feet and landing on both feet.
★ In jumping and landing, the base of support (the distance of the feet from each other) should be shoulder-width.
EASIER: Base of support means the area your feet cover on the floor. A shoulder-width stance keeps you steady, like a table with legs spread properly.
Added example: A safe landing also bends the knees a little to absorb the force, like a spring.

NON-LOCOMOTOR MOVEMENT SKILLS
★ There are 7 non-locomotor movement skills: bending, stretching or extending, lifting or raising, twisting, turning, swinging, and swaying.
EASIER: In all seven, the body stays in place. The arms, legs, trunk, or whole body can move, but you do not travel.

BENDING
★ Bending is a movement around any joint to move from a straight position into a curved position.
EASIER: A joint is where two bones meet, like the elbow, knee, or waist. Bending your elbow turns a straight arm into a curve.

STRETCHING OR EXTENDING
★ Stretching or extending is done by straightening or extending any part of the body from the joints.
EASIER: This is the opposite of bending. A curved arm becomes straight again.

LIFTING OR RAISING
★ Lifting or raising is done by elevating a part of the body, usually the arms and legs.
EASIER: Raising your hand in class or lifting a leg to the side are examples.

TWISTING
★ Twisting is rotating a body part while the base stays stationary.
EASIER: Your feet stay planted while the upper body rotates, like wringing a towel.

TURNING
★ Turning is done by a circular movement of the body, including the base.
EASIER: In turning, the feet move too. You spin your whole body, like turning around to face the back of the room.
EASIER: Twisting versus turning: in twisting the base (feet) stays still, and in turning the base moves with the body.

SWINGING
★ Swinging is moving a body part side to side or forward and back, like a pendulum.
EASIER: Think of the pendulum of a wall clock or an arm swinging back and forth.

SWAYING
★ Swaying is shifting weight from one side to the other side smoothly.
EASIER: Think of a tree moving in the wind, or rocking gently from the left foot to the right foot during a slow song.
EASIER: Swinging versus swaying: swinging moves a body part like a pendulum, while swaying shifts the weight of the body smoothly from side to side.

MANIPULATIVE MOVEMENT SKILLS
★ Manipulative movement skills are grouped into three: sending or propelling objects, receiving and controlling objects, and continuous control skills.

SENDING OR PROPELLING OBJECTS
★ The sending or propelling skills are throwing, kicking, striking or hitting, and volleying.
EASIER: Sending means the object leaves you and goes somewhere else.
Added example: Throwing is sending an object through the air using the hand or hands, such as a softball throw.
Added example: Kicking is sending an object by hitting it with the foot, such as kicking a soccer ball.
Added example: Striking or hitting is sending an object by hitting it with a body part or an implement, such as a bat, racket, or paddle.
Added example: Volleying is hitting an object while it is in the air without letting it rest, such as a volleyball set or a badminton shuttlecock hit.

RECEIVING AND CONTROLLING OBJECTS
★ The receiving and controlling skills are catching and trapping.
EASIER: Receiving means the object comes to you and you gain control of it.
Added example: Catching is receiving an object, usually with the hands, and gaining control of it.
Added example: Trapping is stopping and controlling an object, usually a ball, with a body part such as the foot or chest.

CONTINUOUS CONTROL SKILLS
★ The continuous control skills are dribbling (hands or feet) and rolling.
EASIER: Continuous means you keep controlling the object again and again, not just once.
Added example: Dribbling with the hands is repeated bouncing of a ball, as in basketball. Dribbling with the feet is repeated light kicks that keep the ball close, as in soccer.
Added example: Rolling is moving an object along the ground using the hand or hands, such as rolling a ball in bowling.

EXAMPLE: SKIPPING WITH THE RIGHT FOOT FIRST
⚙ Start standing tall with both feet on the ground.
⚙ Step 1: Step the right foot forward and lift the left foot from the ground.
⚙ Step 2: Hop on the right foot, which is the foot on the ground.
⚙ Step 3: Do the same on the other foot. Step the left foot forward, lift the right foot, and hop on the left foot.
⚙ Final result: The pattern is step-hop on the right, then step-hop on the left. Each foot gets one step and one hop.

EXAMPLE: SHUFFLING WITH THE RIGHT FOOT FIRST
⚙ Start standing tall with both feet on the ground.
⚙ Step 1: Step the right foot forward and lift the left foot from the ground.
⚙ Step 2: Drag the right foot, which is on the floor, backwards, covering a little distance.
⚙ Step 3: Do the same on the other foot. Step the left foot forward, lift the right foot, and drag the left foot backwards a little.
⚙ Final result: The pattern is step-drag on the right, then step-drag on the left. There is no hop, and the feet stay low.

EXAMPLE: GALLOPING WITH THE RIGHT FOOT LEADING
⚙ Start with the knees slightly bent.
⚙ Step 1: Step forward with the right foot. The right foot is now the lead foot.
⚙ Step 2: Bring the left foot (the back foot) up so that its toes chase the heel of the right foot.
⚙ Step 3: Both feet leave the ground.
⚙ Step 4: Land on the back (left) foot first, followed by the lead (right) foot.
⚙ Final result: The right foot stays in front the whole time, the knees stay slightly bent, and the speed stays slow enough that it never becomes a run.

EXAMPLE: CLASSIFYING MOVEMENTS INTO SKILL GROUPS
⚙ Activity: Bouncing a basketball in one spot. An object is used, so it is manipulative (dribbling, a continuous control skill), even though the body stays in place.
⚙ Activity: Bending forward at the waist to touch your toes. No object is used and the body does not travel, so it is non-locomotor (bending).
⚙ Activity: Moving across the room with a step-hop on alternate feet. The body travels, so it is locomotor (skipping).
⚙ Activity: Stopping a rolling soccer ball with your foot. An object is used and it is being received, so it is manipulative (trapping, a receiving and controlling skill).
⚙ Activity: Rocking gently from the left foot to the right foot without moving from your spot. No object, no travel, so it is non-locomotor (swaying).

EXAMPLE: CHOOSING THE RIGHT LOCOMOTOR SKILL
⚙ Take off from one foot and land on the same foot: hopping.
⚙ Take off from one foot, stay in the air a long time, and land on the opposite foot: leaping.
⚙ Take off from one or both feet and land on both feet with feet shoulder-width apart: jumping and landing.
⚙ Step and hop on one foot, then step and hop on the other: skipping.
⚙ Step and drag the foot backwards on the floor, then repeat on the other foot: shuffling.
⚙ Same foot always leads, both feet leave the ground, and the back foot lands first: galloping.
⚙ Belly stays on the ground and the body slides: crawling.
⚙ On hands and knees (or hands and toes) with the belly lifted: creeping.

EXAMPLE: DEMONSTRATING ONE MOVEMENT FROM EACH SKILL GROUP
⚙ Locomotor example, walking: Step 1: Stand tall. Step 2: Transfer your weight to one foot and step forward with the other. Step 3: Swing the arms freely in opposite directions. Result: one foot is always touching the ground.
⚙ Non-locomotor example, bending: Step 1: Stand straight. Step 2: Bend the elbow so the arm goes from straight to curved. Step 3: Stretch it back to straight. Result: you bent and stretched without moving from your place.
⚙ Manipulative example, throwing: Step 1: Hold a ball in your hand. Step 2: Bring the arm back. Step 3: Release the ball forward through the air. Result: you sent an object away from your body.

COMMON MISTAKES
Mistake: Saying that hopping and leaping are the same. Hopping lands on the same foot as the take-off foot. Leaping lands on the opposite foot after a long flight phase.
Mistake: Saying that skipping and galloping are the same. Skipping is a step-hop on alternate feet. Galloping is not a hop or a skip, and one foot stays in the lead.
Mistake: Saying that shuffling includes a hop. Shuffling has a backward draw (drag) instead of a hop.
Mistake: Saying that crawling and creeping are the same. In crawling, the belly stays on the ground. In creeping, the body is on all-fours.
Mistake: Saying that twisting and turning are the same. Twisting keeps the base stationary. Turning moves the whole body including the base.
Mistake: Saying that swinging and swaying are the same. Swinging is pendulum-like movement of a body part. Swaying is smooth shifting of weight from side to side.
Mistake: Calling a skill non-locomotor just because the body stays in place while using an object. If an object is used, the skill is manipulative.
Mistake: Letting galloping speed up into running. Galloping should never become quick enough to be a run.
Mistake: Thinking that walking has a moment when both feet are in the air. In walking, one foot is always in contact with the ground.

EXAM TIPS
Memorize the three groups with the trick Travel, Stay, Handle.
Memorize the counts: 11 locomotor skills and 7 non-locomotor skills.
Memorize the three manipulative subgroups: sending or propelling, receiving and controlling, and continuous control.
Compare similar pairs side by side: hopping versus leaping, crawling versus creeping, twisting versus turning, swinging versus swaying, skipping versus shuffling versus galloping.
Remember the key numbers and positions: base of support is shoulder-width, and the knees are slightly bent in galloping.

SELF-TEST
Q: What are the three skill groups of the fundamental movement skills?
★ Locomotor, non-locomotor, and manipulative.
Q: Which skill group is done by moving from one place to another?
★ Locomotor skills.
Q: How many locomotor skills are listed in this module?
★ Eleven.
Q: What is the difference between crawling and creeping?
★ Crawling keeps the belly on the ground with a sliding movement. Creeping is on all-fours (hands and knees or toes) with the belly lifted.
Q: What does skipping combine?
★ A step and a hop (step-hop pattern), first on one foot and then on the other.
Q: What replaces the hop in shuffling?
★ A draw (drag) backwards.
Q: Which foot lands first in galloping?
★ The back foot lands first, followed by the lead foot.
Q: What is the difference between twisting and turning?
★ Twisting rotates a body part while the base stays stationary. Turning is a circular movement of the whole body including the base.
Q: Name the seven non-locomotor skills.
★ Bending, stretching or extending, lifting or raising, twisting, turning, swinging, and swaying.
Q: Name the skills under receiving and controlling objects.
★ Catching and trapping.
Q: Name the continuous control skills.
★ Dribbling (hands or feet) and rolling.
Q: How wide should the base of support be in jumping and landing?
★ Shoulder-width.
